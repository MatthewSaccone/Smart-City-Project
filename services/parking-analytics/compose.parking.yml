# Optional S4-only additions to the team's root Compose configuration.
services:
  parking-analytics:
    environment:
      PARKING_OCCUPANCY_MODE: ${PARKING_OCCUPANCY_MODE:-fixture}
      PARKING_REFRESH_SECONDS: ${PARKING_REFRESH_SECONDS:-5}
      PARKING_RETRY_MAX_SECONDS: ${PARKING_RETRY_MAX_SECONDS:-60}
      PARKING_CACHE_RETENTION_SECONDS: ${PARKING_CACHE_RETENTION_SECONDS:-86400}
      PARKING_CACHE_PATH: /app/data/parking.sqlite
    volumes:
      - parking-snapshots:/app/data
volumes:
  parking-snapshots:
