name: Repository checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend-smoke-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m compileall services service-registry
