openapi: 3.1.0
info:
  title: Smart City — S7 Gasoline Price Analytics API
  version: 1.0.0
  description: T008 S7 prescriptive contract, aligned with common standards. Two different PR1 S7 requirements are
    both labeled FR3 and distinguished here as FR3(timestamp) and FR3(comparison). All quoted station information
    and prices in examples are synthetic. Providers and user identity issuer are not confirmed.
servers:
- url: http://localhost:8087
  description: Illustrative local development server; client gateway routing must be documented separately.
tags:
- name: Gasoline Prices
  description: Public station/price query and authenticated user reporting.
- name: Operations
  description: Unversioned liveness and readiness probes.
paths:
  /v1/gas-stations:
    get:
      tags:
      - Gasoline Prices
      operationId: searchGasStations
      summary: Find nearby fuel stations and reported prices
      description: PR1 S7 FR1, FR4; QR1, QR3. Geodesic 25,000m maximum radius. Fuel-only search includes known stations
        even if price is unknown. Price bounds require fuel_type and select matching report quote; reversed bounds
        422. Price/time sorting requires fuel_type. Stale quotes included by default but explicitly marked. Pagination
        after filtering and deterministic sorting by station_id tie-breaker.
      security: []
      x-pr1-requirements:
      - FR1
      - FR4
      - QR1
      - QR3
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Latitude'
      - $ref: '#/components/parameters/Longitude'
      - $ref: '#/components/parameters/Radius'
      - $ref: '#/components/parameters/FuelTypeOptional'
      - $ref: '#/components/parameters/PriceMin'
      - $ref: '#/components/parameters/PriceMax'
      - $ref: '#/components/parameters/IncludeStaleTrue'
      - $ref: '#/components/parameters/SearchSort'
      - $ref: '#/components/parameters/SortOrder'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: '200: Result with timestamps, report provenance and explicit availability'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationSearchResponse'
              examples:
                synthetic:
                  summary: Synthetic station/price reports, not verified real pump prices
                  value:
                    items:
                    - station_id: station-example-001
                      name: Example Fuel Station
                      address: 123 Example Road, London, ON
                      latitude: 43.0102
                      longitude: -81.2702
                      distance_m: 300
                      available_fuel_types:
                      - regular_87
                      - premium_91
                      prices:
                      - fuel_type: regular_87
                        price_per_litre: 1.659
                        currency: CAD
                        price_unit: CAD/L
                        price_report_id: a4b2c3d4-1111-4222-8333-444455556666
                        submitted_at: '2026-11-10T17:45:00Z'
                        observed_at: '2026-11-10T17:40:00Z'
                        freshness_basis: observed_at
                        verification_status: unverified
                        source: user_report
                        data_status: user_report
                        is_live: false
                        is_stale: false
                      last_accepted_report_at: '2026-11-10T17:45:00Z'
                      price_coverage_status: available
                      is_stale: false
                    pagination:
                      limit: 25
                      offset: 0
                      total: 1
                      has_more: false
                    as_of: '2026-11-10T18:00:00Z'
                    source: station_catalog_and_user_reports
                    data_status: user_report
                    is_live: false
                    is_stale: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /v1/gas-stations/{station_id}:
    get:
      tags:
      - Gasoline Prices
      operationId: getGasStation
      summary: Retrieve selected station, prices and latest accepted report time
      description: PR1 S7 FR1, FR3 (timestamp), QR3. Single station details. distance_m is null without a search
        origin. Latest accepted report timestamp considers all fuels. Unknown station returns 404.
      security: []
      x-pr1-requirements:
      - FR1
      - FR3(timestamp)
      - QR3
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/StationId'
      - $ref: '#/components/parameters/IncludeStaleTrue'
      responses:
        '200':
          description: '200: Result with timestamps, report provenance and explicit availability'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationDetail'
              examples:
                synthetic:
                  summary: Synthetic station/price reports, not verified real pump prices
                  value:
                    station_id: station-example-001
                    name: Example Fuel Station
                    address: 123 Example Road, London, ON
                    latitude: 43.0102
                    longitude: -81.2702
                    distance_m: null
                    available_fuel_types:
                    - regular_87
                    - premium_91
                    prices:
                    - fuel_type: regular_87
                      price_per_litre: 1.659
                      currency: CAD
                      price_unit: CAD/L
                      price_report_id: a4b2c3d4-1111-4222-8333-444455556666
                      submitted_at: '2026-11-10T17:45:00Z'
                      observed_at: '2026-11-10T17:40:00Z'
                      freshness_basis: observed_at
                      verification_status: unverified
                      source: user_report
                      data_status: user_report
                      is_live: false
                      is_stale: false
                    last_accepted_report_at: '2026-11-10T17:45:00Z'
                    price_coverage_status: available
                    as_of: '2026-11-10T18:00:00Z'
                    source: station_catalog_and_user_reports
                    data_status: user_report
                    is_live: false
                    is_stale: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /v1/gas-prices/comparisons:
    get:
      tags:
      - Gasoline Prices
      operationId: compareGasPrices
      summary: Compare latest eligible reported prices among stations in an area
      description: PR1 S7 FR3 (comparison), QR1. Fuel type mandatory. Exclude stale reports by default. Statistics
        cover all eligible stations before pagination; insufficient comparisons return null summary statistics rather
        than fabricated zero. Unweighted average one latest accepted price per station; equal price ties use station_id.
      security: []
      x-pr1-requirements:
      - FR3(comparison)
      - QR1
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Latitude'
      - $ref: '#/components/parameters/Longitude'
      - $ref: '#/components/parameters/Radius'
      - $ref: '#/components/parameters/FuelTypeRequired'
      - $ref: '#/components/parameters/IncludeStaleFalse'
      - $ref: '#/components/parameters/ComparisonSort'
      - $ref: '#/components/parameters/SortOrder'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: '200: Result with timestamps, report provenance and explicit availability'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonResponse'
              examples:
                synthetic:
                  summary: Synthetic station/price reports, not verified real pump prices
                  value:
                    fuel_type: regular_87
                    currency: CAD
                    price_unit: CAD/L
                    items:
                    - station_id: station-example-001
                      name: Example Fuel Station
                      distance_m: 300
                      quote:
                        fuel_type: regular_87
                        price_per_litre: 1.659
                        currency: CAD
                        price_unit: CAD/L
                        price_report_id: a4b2c3d4-1111-4222-8333-444455556666
                        submitted_at: '2026-11-10T17:45:00Z'
                        observed_at: '2026-11-10T17:40:00Z'
                        freshness_basis: observed_at
                        verification_status: unverified
                        source: user_report
                        data_status: user_report
                        is_live: false
                        is_stale: false
                    - station_id: station-example-002
                      name: Second Example Station
                      distance_m: 750
                      quote:
                        fuel_type: regular_87
                        price_per_litre: 1.699
                        currency: CAD
                        price_unit: CAD/L
                        price_report_id: b5c6d7e8-1111-4222-8333-555566667777
                        submitted_at: '2026-11-10T17:35:00Z'
                        observed_at: null
                        freshness_basis: submitted_at
                        verification_status: unverified
                        source: user_report
                        data_status: user_report
                        is_live: false
                        is_stale: false
                    pagination:
                      limit: 25
                      offset: 0
                      total: 2
                      has_more: false
                    summary:
                      eligible_station_count: 2
                      min_price_per_litre: 1.659
                      max_price_per_litre: 1.699
                      mean_price_per_litre: 1.679
                      spread_per_litre: 0.04
                      comparison_status: available
                    as_of: '2026-11-10T18:00:00Z'
                    source: user_reports
                    data_status: user_report
                    is_live: false
                    is_stale: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /v1/gas-stations/{station_id}/price-reports:
    post:
      tags:
      - Gasoline Prices
      operationId: createGasPriceReport
      summary: Submit an authenticated price report for a known gas station
      description: PR1 S7 FR2, FR3 (timestamp), QR2, QR4. Station ID is path-only. Validated user identity determines
        private owner; server assigns UUID and acceptance time. Price is CAD/L with max three decimals. observed_at
        within 7 days before or 5 minutes after request receipt. On successful creation, persist report and idempotency
        mapping durably before returning 201. Same key, identity, station and canonical body yields same initial
        201 for 24 hours; changed body 409. Reports are user claims not externally verified.
      security:
      - BearerAuth: []
      x-pr1-requirements:
      - FR2
      - FR3(timestamp)
      - QR2
      - QR4
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/StationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        description: Server rejects additional properties including station_id, submitted_at, user_id, owner_id
          and verification_status.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriceReportCreateRequest'
            examples:
              synthetic:
                summary: Synthetic user price report
                value:
                  fuel_type: regular_87
                  price_per_litre: 1.659
                  currency: CAD
                  observed_at: '2026-11-10T17:40:00Z'
      responses:
        '201':
          description: '201: Accepted and durably persisted user-reported price'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriceReportResponse'
              examples:
                synthetic:
                  summary: Synthetic station/price reports, not verified real pump prices
                  value:
                    price_report_id: a4b2c3d4-1111-4222-8333-444455556666
                    station_id: station-example-001
                    fuel_type: regular_87
                    price_per_litre: 1.659
                    currency: CAD
                    price_unit: CAD/L
                    observed_at: '2026-11-10T17:40:00Z'
                    submitted_at: '2026-11-10T17:45:00Z'
                    verification_status: unverified
                    source: user_report
                    data_status: user_report
                    is_live: false
                    is_stale: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ResourceConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health:
    get:
      tags:
      - Operations
      operationId: getHealth
      summary: Process liveness
      description: Unversioned lightweight liveness. No external source/database check.
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: '200: Process responsive'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                synthetic:
                  summary: Synthetic station/price reports, not verified real pump prices
                  value:
                    service: gasoline-analytics
                    status: healthy
  /ready:
    get:
      tags:
      - Operations
      operationId: getReadiness
      summary: Readiness to query and accept durable gas-price reports
      description: 200 when S7-owned station catalog and report storage support necessary reads/writes, including
        using a persisted catalog through provider outage. 503 otherwise. Do not expose credentials.
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: '200: Essential dependencies available'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                synthetic:
                  summary: Synthetic station/price reports, not verified real pump prices
                  value:
                    service: gasoline-analytics
                    status: ready
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Trusted authenticated end-user access token; issuer/claims and verification governed by platform
        security design.
  parameters:
    RequestId:
      in: header
      name: X-Request-ID
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: Untrusted optional input; first trusted ingress validates or replaces. All responses return trusted
        X-Request-ID.
    Latitude:
      in: query
      name: latitude
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
      description: WGS 84 latitude, finite decimal degrees.
    Longitude:
      in: query
      name: longitude
      required: true
      schema:
        type: number
        minimum: -180
        maximum: 180
      description: WGS 84 longitude, finite decimal degrees.
    Radius:
      in: query
      name: radius_m
      required: true
      schema:
        type: number
        exclusiveMinimum: 0
        maximum: 25000
      description: Geodesic search radius in metres, boundary inclusive.
    FuelTypeOptional:
      in: query
      name: fuel_type
      required: false
      schema:
        $ref: '#/components/schemas/FuelType'
    FuelTypeRequired:
      in: query
      name: fuel_type
      required: true
      schema:
        $ref: '#/components/schemas/FuelType'
    PriceMin:
      in: query
      name: min_price_per_litre
      required: false
      schema:
        $ref: '#/components/schemas/Price'
      description: CAD/L lower bound inclusive. Requires fuel_type; min must be <= max.
    PriceMax:
      in: query
      name: max_price_per_litre
      required: false
      schema:
        $ref: '#/components/schemas/Price'
      description: CAD/L upper bound inclusive. Requires fuel_type; min must be <= max.
    IncludeStaleTrue:
      in: query
      name: include_stale
      required: false
      schema:
        type: boolean
        default: true
      description: Return stale quotes with explicit is_stale marking. Does not hide station records.
    IncludeStaleFalse:
      in: query
      name: include_stale
      required: false
      schema:
        type: boolean
        default: false
      description: Exclude stale quotes by default for comparisons. When true, include with explicit markers.
    SearchSort:
      in: query
      name: sort_by
      required: false
      schema:
        type: string
        enum:
        - distance_m
        - name
        - price_per_litre
        - submitted_at
        default: distance_m
      description: Price/time sorting requires fuel_type; tie-break by station_id.
    ComparisonSort:
      in: query
      name: sort_by
      required: false
      schema:
        type: string
        enum:
        - price_per_litre
        - distance_m
        - submitted_at
        default: price_per_litre
      description: Ascending price by default; station_id tie-breaker.
    SortOrder:
      in: query
      name: sort_order
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
        default: asc
    Limit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Offset:
      in: query
      name: offset
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    StationId:
      in: path
      name: station_id
      required: true
      schema: &id001
        type: string
        minLength: 1
        maxLength: 128
        description: Opaque S7-owned identifier.
      description: Existing station ID; unknown ID returns 404.
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]{8,128}$
      description: Scoped to verified user, station and create operation; retained 24 h. Same key + same body returns
        original 201; conflicting body returns 409.
  headers:
    RequestId:
      description: Trusted request correlation ID. On error also in error.request_id.
      schema:
        type: string
        minLength: 1
      example: req-s7-001
    RetryAfter:
      description: Delay until next acceptable request, when known.
      schema:
        type: string
      example: '30'
  responses:
    BadRequest:
      description: '400: Malformed request or request structure.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: BAD_REQUEST
              message: Malformed request or request structure.
              request_id: req-s7-001
              details: []
              retryable: false
              source: service
    AuthenticationRequired:
      description: '401: Missing or invalid user credentials.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: AUTHENTICATION_REQUIRED
              message: Missing or invalid user credentials.
              request_id: req-s7-001
              details: []
              retryable: false
              source: service
    Forbidden:
      description: '403: Authenticated caller lacks permission to submit.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: FORBIDDEN
              message: Authenticated caller lacks permission to submit.
              request_id: req-s7-001
              details: []
              retryable: false
              source: service
    NotFound:
      description: '404: Requested gas station does not exist.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: NOT_FOUND
              message: Requested gas station does not exist.
              request_id: req-s7-001
              details: []
              retryable: false
              source: service
    ResourceConflict:
      description: '409: Conflicting idempotency key or resource state.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: RESOURCE_CONFLICT
              message: Conflicting idempotency key or resource state.
              request_id: req-s7-001
              details: []
              retryable: false
              source: service
    ValidationFailed:
      description: '422: Invalid request field, price or parameter combination.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: VALIDATION_FAILED
              message: Invalid request field, price or parameter combination.
              request_id: req-s7-001
              details: []
              retryable: false
              source: service
    RateLimited:
      description: '429: Request rate limit exceeded.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: RATE_LIMITED
              message: Request rate limit exceeded.
              request_id: req-s7-001
              details: []
              retryable: true
              source: service
    InternalError:
      description: '500: Unexpected service failure.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: INTERNAL_ERROR
              message: Unexpected service failure.
              request_id: req-s7-001
              details: []
              retryable: false
              source: service
    UpstreamFailure:
      description: '502: Upstream station directory response unusable.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: UPSTREAM_FAILURE
              message: Upstream station directory response unusable.
              request_id: req-s7-001
              details: []
              retryable: true
              source: upstream
    ServiceUnavailable:
      description: '503: Required station or report data unavailable.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: Required station or report data unavailable.
              request_id: req-s7-001
              details: []
              retryable: true
              source: service
    UpstreamTimeout:
      description: '504: Required upstream station provider timed out.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: UPSTREAM_TIMEOUT
              message: Required upstream station provider timed out.
              request_id: req-s7-001
              details: []
              retryable: true
              source: upstream
  schemas:
    FuelType:
      type: string
      enum:
      - regular_87
      - midgrade_89
      - premium_91
      - premium_93
      - diesel
    Price:
      type: number
      exclusiveMinimum: 0
      maximum: 20
      multipleOf: 0.001
      description: CAD per litre; no more than three digits after decimal; decimal-safe arithmetic/storage required.
    Pagination:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
        total:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        has_more: &id003
          type: boolean
      required:
      - limit
      - offset
      - total
      - has_more
      additionalProperties: false
    PriceQuote:
      type: object
      properties:
        fuel_type:
          $ref: '#/components/schemas/FuelType'
        price_per_litre:
