openapi: 3.1.0
info:
  title: Smart City — S3 Construction & Incident Reporting API
  version: 1.0.0
  description: Prescriptive initial API contract for S3 PR1 FR1–FR6 and QR1–QR5, following T008 common standards.
    Does not claim implementation status. UTC Z on timestamp output.
servers:
- url: http://localhost:8083
  description: Illustrative local service address; deployment uses discovery/gateway routing.
tags:
- name: Incidents
  description: Public incident query and authenticated report submission/management.
- name: Operations
  description: Liveness and readiness checks.
paths:
  /v1/incidents:
    get:
      tags:
      - Incidents
      operationId: listIncidents
      summary: Search public incident reports within a geographic radius
      description: PR1 FR3, QR1. Only non-withdrawn reports; active by default. Geodesic centre distance; filter
        then stable sort (incident_id ascending tie-breaker) then paginate. An empty match returns 200 with
        items=[]. Public read.
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Latitude'
      - $ref: '#/components/parameters/Longitude'
      - $ref: '#/components/parameters/Radius'
      - name: incident_type
        in: query
        required: false
        schema: &id020
          type: string
          enum:
          - construction
          - accident
          - other_traffic
        description: Optional incident-type filter.
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - resolved
          - completed
          - inaccurate
          - all
          default: active
        description: Default active; all includes every non-withdrawn status.
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - submitted_at
          - updated_at
          - distance_from_center_m
          default: submitted_at
        description: Stable report sort field; incident_id ascending breaks ties.
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: Ascending or descending primary sort.
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: A paginated collection of public incident reports.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentListResponse'
              examples:
                typical:
                  value:
                    items:
                    - incident_id: e0b7286a-789d-4c76-b640-3f1c77f8029b
                      incident_type: construction
                      status: active
                      location: &id001
                        latitude: 43.0096
                        longitude: -81.2737
                      submitted_at: '2026-11-10T18:00:00Z'
                      updated_at: '2026-11-10T18:00:00Z'
                      source: user_report
                      is_live: false
                      is_stale: false
                      data_status: user_report
                      distance_from_center_m: 130.0
                    pagination:
                      limit: 25
                      offset: 0
                      total: 1
                      has_more: false
                    as_of: '2026-11-10T18:00:00Z'
        '400': &id003
          $ref: '#/components/responses/BadRequest'
        '404': &id004
          $ref: '#/components/responses/NotFound'
        '422': &id005
          $ref: '#/components/responses/ValidationFailed'
        '429': &id006
          $ref: '#/components/responses/RateLimited'
        '500': &id007
          $ref: '#/components/responses/InternalError'
        '503': &id008
          $ref: '#/components/responses/Unavailable'
    post:
      tags:
      - Incidents
      operationId: createIncident
      summary: Submit and persist a new incident report
      description: PR1 FR1, FR2, QR2, QR4. Bearer identity determines private owner; server assigns status
        active, UUID and submitted_at. Same Idempotency-Key and canonical body for same authenticated user
        returns identical original 201 response during 24-hour retention; mismatched body returns 409.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentCreateRequest'
            examples:
              typical:
                value:
                  incident_type: construction
                  location: *id001
                  description: Road construction is blocking the westbound lane near the intersection.
                  observed_at: '2026-11-10T17:52:00Z'
      responses:
        '201':
          description: Created report committed durably before response.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentReport'
              examples:
                typical:
                  value: &id002
                    incident_id: e0b7286a-789d-4c76-b640-3f1c77f8029b
                    incident_type: construction
                    status: active
                    location: *id001
                    description: Road construction is blocking the westbound lane near the intersection.
                    observed_at: '2026-11-10T17:52:00Z'
                    submitted_at: '2026-11-10T18:00:00Z'
                    updated_at: '2026-11-10T18:00:00Z'
                    source: user_report
                    is_live: false
                    is_stale: false
                    data_status: user_report
                    as_of: '2026-11-10T18:00:00Z'
        '400': &id009
          $ref: '#/components/responses/BadRequest'
        '401': &id010
          $ref: '#/components/responses/AuthenticationRequired'
        '409': &id011
          $ref: '#/components/responses/ResourceConflict'
        '422': &id012
          $ref: '#/components/responses/ValidationFailed'
        '429': &id013
          $ref: '#/components/responses/RateLimited'
        '500': &id014
          $ref: '#/components/responses/InternalError'
        '502': &id015
          $ref: '#/components/responses/UpstreamFailure'
        '503': &id016
          $ref: '#/components/responses/Unavailable'
        '504': &id017
          $ref: '#/components/responses/UpstreamTimeout'
  /v1/incidents/{incident_id}:
    get:
      tags:
      - Incidents
      operationId: getIncident
      summary: Retrieve detailed public incident report
      description: PR1 FR4, QR1. Public detail for non-withdrawn reports. Missing or withdrawn reports return
        404. Owner identity and audit metadata are excluded.
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IncidentId'
      responses:
        '200':
          description: Detailed non-withdrawn report.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentReport'
              examples:
                typical:
                  value: *id002
        '400': *id003
        '404': *id004
        '422': *id005
        '429': *id006
        '500': *id007
        '503': *id008
    patch:
      tags:
      - Incidents
      operationId: updateIncident
      summary: Modify incident or set resolved/completed/inaccurate status
      description: PR1 FR5, FR6, QR3, QR5. Requires verified report owner or authorized moderator; at least
        one mutable property. Status transitions only active->resolved/completed/inaccurate and those three
        statuses->active. Withdrawn reports cannot be patched. No-op does not change updated_at.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IncidentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentPatchRequest'
            examples:
              typical:
                value:
                  description: Westbound lane remains closed; a signed detour is available.
                  status: resolved
      responses:
        '200':
          description: Modified report committed atomically.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentReport'
              examples:
                typical:
                  value:
                    incident_id: e0b7286a-789d-4c76-b640-3f1c77f8029b
                    incident_type: construction
                    status: resolved
                    location: *id001
                    description: Westbound lane remains closed; a signed detour is available.
                    observed_at: '2026-11-10T17:52:00Z'
                    submitted_at: '2026-11-10T18:00:00Z'
                    updated_at: '2026-11-10T18:15:00Z'
                    source: user_report
                    is_live: false
                    is_stale: false
                    data_status: user_report
                    as_of: '2026-11-10T18:15:00Z'
        '400': *id009
        '401': *id010
        '403': &id018
          $ref: '#/components/responses/Forbidden'
        '404': &id019
          $ref: '#/components/responses/NotFound'
        '409': *id011
        '422': *id012
        '429': *id013
        '500': *id014
        '502': *id015
        '503': *id016
        '504': *id017
    delete:
      tags:
      - Incidents
      operationId: withdrawIncident
      summary: Withdraw incident report
      description: PR1 FR5, QR3, QR5. Owner/moderator only. Durable soft withdrawal, excluded from public endpoints.
        Repeated delete by same authorized owner/moderator returns 204. No request body.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IncidentId'
      responses:
        '204':
          description: Report withdrawn, or already withdrawn by this authorized caller. No body.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '400': *id009
        '401': *id010
        '403': *id018
        '404': *id019
        '409': *id011
        '422': *id012
        '429': *id013
        '500': *id014
        '502': *id015
        '503': *id016
        '504': *id017
  /health:
    get:
      tags:
      - Operations
      operationId: getHealth
      summary: Liveness probe; no expensive dependency checks
      security: []
      responses:
        '200':
          description: Process is responsive.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                typical:
                  value:
                    service: construction-incidents
                    status: healthy
  /ready:
    get:
      tags:
      - Operations
      operationId: getReadiness
      summary: Readiness probe for durable reporting and authentication
      security: []
      description: Ready only when required read/write persistence and trusted token verification capabilities
        are available; optional municipal feeds do not determine readiness.
      responses:
        '200':
          description: Core report operations can be performed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                typical:
                  value:
                    service: construction-incidents
                    status: ready
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-or-JWT
      description: Platform-authorized access token. Verify identity and roles; never trust a claimed owner_id
        from client.
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Only IDs from trusted ingress are propagated; untrusted values replaced/validated.
      schema:
        type: string
        maxLength: 128
    IncidentId:
      name: incident_id
      in: path
      required: true
      schema: &id021
        type: string
        format: uuid
        description: Opaque server-generated UUID; not a proof of ownership.
      description: Opaque UUID of the requested report.
    Latitude:
      name: latitude
      in: query
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
      description: WGS84 latitude, finite.
    Longitude:
      name: longitude
      in: query
      required: true
      schema:
        type: number
        minimum: -180
        maximum: 180
      description: WGS84 longitude, finite.
    Radius:
      name: radius_m
      in: query
      required: true
      schema:
        type: number
        exclusiveMinimum: 0
        maximum: 25000
      description: Geodesic search radius, metres; T008 limit.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
      description: User+POST path scope; 24h retention; identical replay returns same original response.
  headers:
    RequestId:
      description: Trusted/generated request ID included in response and error body.
      schema:
        type: string
        minLength: 1
    Location:
      description: Canonical public URL of created incident.
      schema:
        type: string
        example: /v1/incidents/e0b7286a-789d-4c76-b640-3f1c77f8029b
  responses:
    BadRequest:
      description: Malformed or structurally invalid request.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: BAD_REQUEST
              message: Malformed or structurally invalid request.
              request_id: req-example-001
              details: []
              retryable: false
              source: service
    AuthenticationRequired:
      description: Valid user authentication is required.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: AUTHENTICATION_REQUIRED
              message: Valid user authentication is required.
              request_id: req-example-001
              details: []
              retryable: false
              source: service
    Forbidden:
      description: You are not allowed to modify this report.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: FORBIDDEN
              message: You are not allowed to modify this report.
              request_id: req-example-001
              details: []
              retryable: false
              source: service
    NotFound:
      description: The requested incident report is not available.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: NOT_FOUND
              message: The requested incident report is not available.
              request_id: req-example-001
              details: []
              retryable: false
              source: service
    ResourceConflict:
      description: The requested state transition or idempotency-key use conflicts with existing state.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: RESOURCE_CONFLICT
              message: The requested state transition or idempotency-key use conflicts with existing state.
              request_id: req-example-001
              details: []
              retryable: false
              source: service
    ValidationFailed:
      description: The submitted values violate documented constraints.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: VALIDATION_FAILED
              message: The submitted values violate documented constraints.
              request_id: req-example-001
              details: []
              retryable: false
              source: service
    RateLimited:
      description: Request rate limit exceeded.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: RATE_LIMITED
              message: Request rate limit exceeded.
              request_id: req-example-001
              details: []
              retryable: true
              source: gateway
    InternalError:
      description: An unexpected service error occurred.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: INTERNAL_ERROR
              message: An unexpected service error occurred.
              request_id: req-example-001
              details: []
              retryable: false
              source: service
    UpstreamFailure:
      description: A required upstream provider returned an unusable response.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: UPSTREAM_FAILURE
              message: A required upstream provider returned an unusable response.
              request_id: req-example-001
              details: []
              retryable: true
              source: upstream
    Unavailable:
      description: An essential persistence or authentication dependency is unavailable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: An essential persistence or authentication dependency is unavailable.
              request_id: req-example-001
              details: []
              retryable: true
              source: service
    UpstreamTimeout:
      description: An essential upstream dependency timed out.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: UPSTREAM_TIMEOUT
              message: An essential upstream dependency timed out.
              request_id: req-example-001
              details: []
              retryable: true
              source: upstream
  schemas:
    Coordinate:
      type: object
      additionalProperties: false
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: WGS84 decimal degrees; finite.
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: WGS84 decimal degrees; finite.
      required:
      - latitude
      - longitude
    IncidentCreateRequest:
      type: object
      additionalProperties: false
      properties:
        incident_type: *id020
        location:
          $ref: '#/components/schemas/Coordinate'
        description:
          type: string
          minLength: 10
          maxLength: 2000
          description: Trim whitespace before length checks; nonblank user-provided text.
        observed_at: &id022
          type: string
          format: date-time
          description: Timezone-aware ISO 8601 instant on input, UTC Z on output.
      required:
      - incident_type
      - location
      - description
      description: Owner, status, submitted_at and updated_at are assigned by the server. observed_at cannot
        be more than five minutes after receipt.
    IncidentPatchRequest:
      type: object
      additionalProperties: false
      properties:
        incident_type: *id020
        location:
          $ref: '#/components/schemas/Coordinate'
        description:
          type: string
          minLength: 10
          maxLength: 2000
          description: Trim whitespace; nonblank.
        status: &id023
          type: string
          enum:
          - active
          - resolved
          - completed
          - inaccurate
      required: []
      minProperties: 1
      description: All attributes optional, but at least one must appear. No withdrawal via PATCH; only owner
        or moderator.
    IncidentReport:
      type: object
      additionalProperties: false
      properties:
        incident_id: *id021
        incident_type: *id020
        status:
          type: string
          enum:
          - active
          - resolved
          - completed
          - inaccurate
          - withdrawn
        location:
          $ref: '#/components/schemas/Coordinate'
        description:
          type: string
          minLength: 10
          maxLength: 2000
        observed_at:
          anyOf:
          - *id022
          - type: 'null'
          description: When event was noticed; null if not provided.
        submitted_at: *id022
        updated_at: *id022
        source: &id024
          type: string
          const: user_report
        is_live: &id025
          type: boolean
          const: false
        is_stale: &id026
          type: boolean
          description: For active reports, true when as_of - updated_at > 7 days; other statuses false.
        data_status: &id027
          type: string
          const: user_report
        as_of: *id022
      required:
      - incident_id
      - incident_type
      - status
      - location
      - description
      - observed_at
      - submitted_at
      - updated_at
      - source
      - is_live
      - is_stale
      - data_status
      - as_of
      description: Public full report; never includes owner identifier or internal audit trail.
    IncidentSummary:
      type: object
      additionalProperties: false
      properties:
        incident_id: *id021
        incident_type: *id020
        status: *id023
        location:
          $ref: '#/components/schemas/Coordinate'
        distance_from_center_m:
          type: number
          minimum: 0
          description: Geodesic metres from requested centre.
        submitted_at: *id022
        updated_at: *id022
        source: *id024
        is_live: *id025
        is_stale: *id026
        data_status: *id027
      required:
      - incident_id
      - incident_type
      - status
      - location
      - distance_from_center_m
      - submitted_at
      - updated_at
      - source
      - is_live
      - is_stale
      - data_status
      description: Public list item, without owner identifier or full description.
    Pagination:
      type: object
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
        total:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        has_more:
          type: boolean
      required:
      - limit
      - offset
      - total
      - has_more
    IncidentListResponse:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IncidentSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'
        as_of: *id022
      required:
      - items
      - pagination
      - as_of
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
      required:
      - field
      - reason
    ErrorCore:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        message:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        retryable:
          type: boolean
        source:
          type: string
          enum:
          - service
          - upstream
          - gateway
      required:
      - code
      - message
      - request_id
      - details
      - retryable
      - source
    ErrorEnvelope:
      type: object
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorCore'
      required:
      - error
    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        service:
          type: string
          const: construction-incidents
        status:
          type: string
          const: healthy
      required:
      - service
      - status
    ReadyResponse:
      type: object
      additionalProperties: false
      properties:
        service:
          type: string
          const: construction-incidents
        status:
          type: string
          const: ready
      required:
      - service
      - status
