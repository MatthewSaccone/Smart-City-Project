openapi: 3.1.0
info:
  title: Smart City — S4 Parking Analytics API
  version: 1.1.0
  description: T008 design contract for parking facility search, time-location-based occupancy estimation, selected-facility
    rates and fees, and provider-outage fallback. Follows Smart City Common API Standards. PR1 sets facility-information
    latency <= 2,000 ms, 25 concurrent prediction requests, update timestamps and degraded behavior. S4 design
    choices include 300-second occupancy and 24-hour price freshness limits. The specification does not assert
    implementation or provider selection. All successful timestamp outputs are UTC ISO 8601/RFC 3339 with Z; timezone-aware
    offset inputs accepted and normalized.
tags:
- name: Parking Facilities
  description: Public catalog, availability and pricing queries
- name: Occupancy Estimation
  description: Authenticated internal computation from pseudonymous time-location samples
- name: Operations
  description: Liveness and readiness
paths:
  /v1/parking/facilities:
    get:
      tags:
      - Parking Facilities
      operationId: searchParkingFacilities
      summary: Search parking facilities and retrieve current/degraded availability summaries
      description: 'S4 FR1/FR2, QR1/QR2/QR4. Searches by facility-center bounding box with 2-degree maximum latitude
        and longitude spans; no antimeridian-crossing box. Unknown occupancy does not imply available parking.
        Filter, stable-sort, then paginate. Empty results use items: [].'
      x-pr1-requirements:
      - S4 FR1
      - S4 FR2
      - S4 QR1
      - S4 QR2
      - S4 QR4
      security:
      - ServiceBearer: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/MinLatitude'
      - $ref: '#/components/parameters/MinLongitude'
      - $ref: '#/components/parameters/MaxLatitude'
      - $ref: '#/components/parameters/MaxLongitude'
      - $ref: '#/components/parameters/FacilityStatus'
      - $ref: '#/components/parameters/AvailabilityStatus'
      - $ref: '#/components/parameters/SortBy'
      - $ref: '#/components/parameters/SortOrder'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Filtered, sorted, paginated facility summaries.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilitySearchResponse'
              examples:
                typical:
                  summary: Synthetic illustrative response
                  value:
                    items:
                    - facility_id: parking-001
                      name: Example Downtown Parking
                      latitude: 43.015
                      longitude: -81.25
                      capacity: 120
                      geofence_radius_m: 80
                      facility_status: open
                      availability_status: available
                      occupancy: &id001
                        estimated_occupied_spaces: 55
                        estimated_available_spaces: 65
                        occupancy_ratio: 0.4583
                        congestion: low
                        observed_at: '2026-11-10T17:59:30Z'
                        service_updated_at: '2026-11-10T18:00:00Z'
                        is_live: true
                        is_stale: false
                        source: parking_observation_provider
                        data_status: live
                      pricing:
                        currency: CAD
                        starting_rate_amount: 3.5
                        starting_rate_unit: hour
                        source_updated_at: '2026-11-10T09:00:00Z'
                        service_updated_at: '2026-11-10T09:01:00Z'
                        is_live: false
                        is_stale: false
                        source: parking_rate_provider
                        data_status: cached
                    pagination:
                      limit: 25
                      offset: 0
                      total: 1
                      has_more: false
                    as_of: '2026-11-10T18:00:00Z'
                    facility_source: parking_facility_catalog
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /v1/parking/facilities/{facility_id}:
    get:
      tags:
      - Parking Facilities
      operationId: getParkingFacility
      summary: Retrieve one facility with occupancy, parking rates and additional fees
      description: S4 FR2/FR3, QR1/QR2/QR4. Rates and fees are informational, not a final quote. Missing pricing
        is explicit in the pricing snapshot; null measurement is not zero. Existing facility data remains available
        when occupancy source fails.
      x-pr1-requirements:
      - S4 FR2
      - S4 FR3
      - S4 QR1
      - S4 QR2
      - S4 QR4
      security:
      - ServiceBearer: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/FacilityId'
      responses:
        '200':
          description: Facility details with occupancy and full parking pricing.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityDetailResponse'
              examples:
                typical:
                  summary: Synthetic illustrative response
                  value:
                    facility: &id002
                      facility_id: parking-001
                      name: Example Downtown Parking
                      latitude: 43.015
                      longitude: -81.25
                      capacity: 120
                      geofence_radius_m: 80
                      facility_status: open
                    availability_status: available
                    occupancy: *id001
                    pricing:
                      currency: CAD
                      rates:
                      - rate_id: hourly
                        label: Standard hourly rate
                        amount: 3.5
                        unit: hour
                      - rate_id: daily
                        label: Daily maximum
                        amount: 18
                        unit: day
                      additional_fees:
                      - fee_id: service_fee
                        label: Per-entry service fee
                        amount: 1
                      tax_included: false
                      source_updated_at: '2026-11-10T09:00:00Z'
                      service_updated_at: '2026-11-10T09:01:00Z'
                      is_live: false
                      is_stale: false
                      source: parking_rate_provider
                      data_status: cached
                    as_of: '2026-11-10T18:00:00Z'
                    facility_source: parking_facility_catalog
                degraded:
                  summary: Fallback response with unknown data
                  value:
                    facility: *id002
                    availability_status: unknown
                    occupancy:
                      estimated_occupied_spaces: null
                      estimated_available_spaces: null
                      occupancy_ratio: null
                      congestion: unknown
                      observed_at: null
                      service_updated_at: null
                      is_live: false
                      is_stale: true
                      source: unavailable
                      data_status: unavailable
                    pricing:
                      currency: null
                      rates: []
                      additional_fees: []
                      tax_included: null
                      source_updated_at: null
                      service_updated_at: null
                      is_live: false
                      is_stale: true
                      source: unavailable
                      data_status: unavailable
                    as_of: '2026-11-10T18:00:00Z'
                    facility_source: parking_facility_catalog
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /v1/parking/occupancy/estimate:
    post:
      tags:
      - Occupancy Estimation
      operationId: estimateParkingOccupancy
      summary: Compute occupancy from pseudonymous timestamped location observations
      description: S4 FR2/QR3. Restricted service-to-service computation only, no storage of submitted observations
        and no update to public occupancy cache. Uses a 120-second window, requires latest subject observation
        at most 60 seconds old, minimum 30-second continuous dwell and <=60-second sample gaps; nearest facility
        wins overlapping geofences. Identical subject-time coordinates deduplicated; contradictory same-time coordinates
        rejected. Optional as_of defaults to current UTC time and may not exceed receipt time by >60 seconds.
        Historical replays are never labeled live. A request with no usable observations returns unknown rather
        than zero occupancy.
      x-pr1-requirements:
      - S4 FR2
      - S4 QR3
      security:
      - ServiceBearer: []
      x-required-permission: parking:estimate
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        description: Pseudonymous non-persisted observations; max 10,000; no undeclared fields.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateRequest'
            examples:
              two_samples:
                value:
                  as_of: '2026-11-10T18:00:00Z'
                  observations:
                  - subject_id: pseudonym-17
                    latitude: 43.015
                    longitude: -81.25
                    observed_at: '2026-11-10T17:59:00Z'
                  - subject_id: pseudonym-17
                    latitude: 43.015
                    longitude: -81.25
                    observed_at: '2026-11-10T17:59:40Z'
      responses:
        '200':
          description: Computed occupancy estimate, not an authoritative live availability guarantee.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateResponse'
              examples:
                typical:
                  summary: Synthetic illustrative response
                  value:
                    items:
                    - facility_id: parking-001
                      estimated_occupied_spaces: 1
                      estimated_available_spaces: 119
                      occupancy_ratio: 0.0083
                      congestion: low
                      qualifying_subjects: 1
                      capacity_exceeded: false
                      latest_observation_at: '2026-11-10T17:59:40Z'
                    as_of: '2026-11-10T18:00:00Z'
                    method: stationary_unique_subjects_v1
                    source: submitted_observations
                    is_live: false
                    is_stale: true
                    data_status: computed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/parking/ingestion/status:
    get:
      tags: [Parking]
      operationId: getParkingIngestionStatus
      summary: Inspect independent catalog, pricing and occupancy refresh/cache health
      security:
      - ServiceBearer: []
      responses:
        '200':
          description: Operational state without source paths, credentials or user observations.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /health:
    get:
      tags:
      - Operations
      operationId: getHealth
      summary: Liveness of parking-analytics process
      description: No expensive provider/database probe; operational access restricted by deployment/network policy.
      security: []
      responses:
        '200':
          description: Process is responsive.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                typical:
                  summary: Synthetic illustrative response
                  value:
                    service: parking-analytics
                    status: healthy
  /ready:
    get:
      tags:
      - Operations
      operationId: getReadiness
      summary: Readiness to return facility catalog in normal or degraded/fallback mode
      description: A usable facility catalog is essential. Loss of live occupancy data does not alone make the
        service unready when a truthful fallback can be provided. Monitoring access restricted by network policy.
      security: []
      responses:
        '200':
          description: Facility service can serve live or valid degraded responses.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              examples:
                typical:
                  summary: Synthetic illustrative response
                  value:
                    service: parking-analytics
                    status: ready
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    ServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Trusted RS256 JWT checked against the same Keycloak issuer, audience and JWKS as S2/S3.
        All parking operations require identity; occupancy estimation also requires the signed parking:estimate permission.
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional incoming correlation identifier; only trusted IDs are propagated, otherwise replaced.
      schema:
        type: string
        maxLength: 128
    MinLatitude:
      name: min_lat
      in: query
      required: true
      description: min_lat WGS 84 decimal degrees; min <= max and span <= 2.0 degrees.
      schema:
        type: number
        minimum: -90
        maximum: 90
    MaxLatitude:
      name: max_lat
      in: query
      required: true
      description: max_lat WGS 84 decimal degrees; min <= max and span <= 2.0 degrees.
      schema:
        type: number
        minimum: -90
        maximum: 90
    MinLongitude:
      name: min_lon
      in: query
      required: true
      description: min_lon WGS 84 decimal degrees; min <= max and span <= 2.0 degrees; no antimeridian boxes.
      schema:
        type: number
        minimum: -180
        maximum: 180
    MaxLongitude:
      name: max_lon
      in: query
      required: true
      description: max_lon WGS 84 decimal degrees; min <= max and span <= 2.0 degrees; no antimeridian boxes.
      schema:
        type: number
        minimum: -180
        maximum: 180
    FacilityStatus:
      name: facility_status
      in: query
      required: false
      description: Optional facility operational-status filter.
      schema:
        type: string
        enum:
        - open
        - closed
        - unknown
    AvailabilityStatus:
      name: availability_status
      in: query
      required: false
      description: Optional availability-status filter; unknown occupancy is not treated as available.
      schema:
        type: string
        enum:
        - available
        - full
        - closed
        - unknown
    SortBy:
      name: sort_by
      in: query
      required: false
      description: Sortable fields only; facility_id is a stable tie-breaker.
      schema:
        type: string
        enum:
        - name
        - facility_id
        default: name
    SortOrder:
      name: sort_order
      in: query
      required: false
      description: Sort direction.
      schema:
        type: string
        enum:
        - asc
        - desc
        default: asc
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum items returned per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Offset:
      name: offset
      in: query
      required: false
      description: Number of sorted matches to skip.
      schema:
        type: integer
        minimum: 0
        default: 0
    FacilityId:
      name: facility_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[a-z0-9][a-z0-9_-]*$
      description: Stable facility identifier within S4.
  headers:
    RequestId:
      description: Trusted request correlation identifier.
      schema:
        type: string
        minLength: 1
  schemas:
    IngestionStatus:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
        sources:
          type: object
          additionalProperties:
            type: boolean
        revisions:
          type: object
          additionalProperties:
            type: string
        last_success_at:
          type: object
          additionalProperties:
            type: string
            format: date-time
        updates:
          type: integer
          minimum: 0
        notifications_received:
          type: integer
          minimum: 0
        notifications_rejected:
          type: integer
          minimum: 0
        broker_connected:
          type: boolean
        consecutive_failures:
          type: integer
          minimum: 0
        retry_seconds:
          type: number
        persistent_cache:
          type: boolean
      required: [mode, sources, revisions, last_success_at, updates, notifications_received, notifications_rejected, broker_connected, consecutive_failures, retry_seconds, persistent_cache]
    Pagination:
      type: object
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
        total:
          type:
          - integer
          - 'null'
          description: Exact number of matching facilities, or null if an exact count is unavailable.
          minimum: 0
        has_more:
          type: boolean
      required:
      - limit
      - offset
      - total
      - has_more
      description: Standard offset-pagination metadata. If total is unknown, has_more is determined from one extra
        result.
    Facility:
      type: object
      additionalProperties: false
      properties:
        facility_id: &id005
          type: string
          description: Stable opaque identifier within S4.
          minLength: 1
          maxLength: 64
          pattern: ^[a-z0-9][a-z0-9_-]*$
        name: &id006
          type: string
          minLength: 1
          maxLength: 160
        latitude: &id007
          type: number
          description: WGS 84 decimal degrees.
          minimum: -90
          maximum: 90
        longitude: &id008
          type: number
          description: WGS 84 decimal degrees.
          minimum: -180
          maximum: 180
        capacity: &id009
          type: integer
          description: Maximum usable parking spaces; not current availability.
          minimum: 1
        geofence_radius_m: &id010
          anyOf:
          - type: number
            description: Meters; used for observation assignment.
            exclusiveMinimum: 0
            maximum: 500
          - type: 'null'
          description: Optional assignment geofence; null means it is unknown.
        facility_status: &id011
          type: string
          enum:
          - open
          - closed
          - unknown
      required:
      - facility_id
      - name
      - latitude
      - longitude
      - capacity
      - geofence_radius_m
      - facility_status
    OccupancySnapshot:
      type: object
      additionalProperties: false
      properties:
        estimated_occupied_spaces:
          type:
          - integer
          - 'null'
          description: Estimated spaces occupied; null if not estimable.
          minimum: 0
        estimated_available_spaces:
          type:
          - integer
          - 'null'
          description: Estimated free spaces; null if not estimable.
          minimum: 0
        occupancy_ratio:
          type:
          - number
          - 'null'
          description: Estimated occupied/capacity fraction.
          minimum: 0
          maximum: 1
        congestion: &id014
          type: string
          enum:
          - unknown
          - low
          - moderate
          - high
          - full
        observed_at: &id003
          type:
          - string
          - 'null'
          description: Timestamp in UTC with Z on output, or null if unknown.
          format: date-time
        service_updated_at: *id003
        is_live:
          type: boolean
        is_stale:
          type: boolean
        source:
          type: string
          description: Provider/source identifier; unavailable when no provider is known.
        data_status: &id004
          type: string
          enum:
          - live
          - cached
          - simulated
          - unavailable
      required:
      - estimated_occupied_spaces
      - estimated_available_spaces
      - occupancy_ratio
      - congestion
      - observed_at
      - service_updated_at
      - is_live
      - is_stale
      - source
      - data_status
      description: A fresh live estimate requires latest observation no older than 300 seconds. Stale counts are
        not evidence of currently available spaces.
    PricingOverview:
      type: object
      additionalProperties: false
      properties:
        currency:
          type:
          - string
          - 'null'
          description: CAD or null if unavailable.
          enum:
          - CAD
          - null
        starting_rate_amount:
          type:
          - number
          - 'null'
          description: Informational starting rate in CAD, or null if unavailable.
          minimum: 0
        starting_rate_unit:
          type:
          - string
          - 'null'
          enum:
          - hour
          - day
          - entry
          - null
        source_updated_at: *id003
        service_updated_at: *id003
        is_live:
          type: boolean
        is_stale:
          type: boolean
        source:
          type: string
        data_status: *id004
      required:
      - currency
      - starting_rate_amount
      - starting_rate_unit
      - source_updated_at
      - service_updated_at
      - is_live
      - is_stale
      - source
      - data_status
      description: Tariff provider timestamp threshold 24 hours; starting rate does not include unspecified fees.
    ParkingRate:
      type: object
      additionalProperties: false
      properties:
        rate_id:
          type: string
          minLength: 1
          maxLength: 64
        label:
          type: string
          minLength: 1
          maxLength: 160
        amount:
          type: number
          description: Nonnegative CAD amount, two fractional decimal places.
          minimum: 0
          multipleOf: 0.01
        unit:
          type: string
          enum:
          - hour
          - day
          - entry
      required:
      - rate_id
      - label
      - amount
      - unit
      description: Rate is informational; any applicable tax/fee is separate.
    ParkingFee:
      type: object
      additionalProperties: false
      properties:
        fee_id:
          type: string
          minLength: 1
          maxLength: 64
        label:
          type: string
          minLength: 1
          maxLength: 160
        amount:
          type: number
          description: Nonnegative CAD charge.
          minimum: 0
          multipleOf: 0.01
      required:
      - fee_id
      - label
      - amount
    PricingDetails:
      type: object
      additionalProperties: false
      properties:
        currency:
          type:
          - string
          - 'null'
          description: CAD, or null when there is no price information.
          enum:
          - CAD
          - null
        rates:
          type: array
          items:
            $ref: '#/components/schemas/ParkingRate'
          maxItems: 100
        additional_fees:
          type: array
          items:
            $ref: '#/components/schemas/ParkingFee'
          maxItems: 100
        tax_included:
          type:
          - boolean
          - 'null'
          description: Whether displayed rates include applicable tax; null when unknown.
        source_updated_at: *id003
        service_updated_at: *id003
        is_live:
          type: boolean
        is_stale:
          type: boolean
        source:
          type: string
        data_status: *id004
      required:
      - currency
      - rates
      - additional_fees
      - tax_included
      - source_updated_at
      - service_updated_at
      - is_live
      - is_stale
      - source
      - data_status
      description: 'When unavailable: empty rates and fees, null currency/tax/timestamps, is_stale true, status
        unavailable. Unknown does not imply free.'
    FacilitySearchItem:
      type: object
      additionalProperties: false
      properties:
        facility_id: *id005
        name: *id006
        latitude: *id007
        longitude: *id008
        capacity: *id009
        geofence_radius_m: *id010
        facility_status: *id011
        availability_status: &id012
          type: string
          enum:
          - available
          - full
          - closed
          - unknown
        occupancy:
          $ref: '#/components/schemas/OccupancySnapshot'
        pricing:
          $ref: '#/components/schemas/PricingOverview'
      required:
      - facility_id
      - name
      - latitude
      - longitude
      - capacity
      - geofence_radius_m
      - facility_status
      - availability_status
      - occupancy
      - pricing
    FacilitySearchResponse:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FacilitySearchItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
        as_of: &id013
          type: string
          description: UTC ISO 8601/RFC 3339 timestamp, with Z on output.
          format: date-time
        facility_source:
          type: string
          description: Name of source feeding the facility catalog.
      required:
      - items
      - pagination
      - as_of
      - facility_source
    FacilityDetailResponse:
      type: object
      additionalProperties: false
      properties:
        facility:
          $ref: '#/components/schemas/Facility'
        availability_status: *id012
        occupancy:
          $ref: '#/components/schemas/OccupancySnapshot'
        pricing:
          $ref: '#/components/schemas/PricingDetails'
        as_of: *id013
        facility_source:
          type: string
      required:
      - facility
      - availability_status
      - occupancy
      - pricing
      - as_of
      - facility_source
    Observation:
      type: object
      additionalProperties: false
      properties:
        subject_id:
          type: string
          description: Pseudonymous identifier; must not contain direct personal identifiers.
          minLength: 1
          maxLength: 128
          pattern: \S
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        observed_at: *id013
      required:
      - subject_id
      - latitude
      - longitude
      - observed_at
    EstimateRequest:
      type: object
      additionalProperties: false
      properties:
        observations:
          type: array
          items:
            $ref: '#/components/schemas/Observation'
          minItems: 0
          maxItems: 10000
        as_of: *id013
      required:
      - observations
      description: as_of is optional, defaults to server time; must not be more than 60 seconds in the future.
        Conflicting positions at one subject timestamp are invalid. Unknown body keys rejected.
    OccupancyEstimate:
      type: object
      additionalProperties: false
      properties:
        facility_id:
          type: string
        estimated_occupied_spaces:
          type:
          - integer
          - 'null'
          minimum: 0
        estimated_available_spaces:
          type:
          - integer
          - 'null'
          minimum: 0
        occupancy_ratio:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        congestion: *id014
        qualifying_subjects:
          type: integer
          minimum: 0
        capacity_exceeded:
          type: boolean
        latest_observation_at: *id003
      required:
      - facility_id
      - estimated_occupied_spaces
      - estimated_available_spaces
      - occupancy_ratio
      - congestion
      - qualifying_subjects
      - capacity_exceeded
      - latest_observation_at
    EstimateResponse:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OccupancyEstimate'
        as_of: *id013
        method:
          type: string
          enum:
          - stationary_unique_subjects_v1
        source:
          type: string
          enum:
          - submitted_observations
        is_live:
          type: boolean
          const: false
        is_stale:
          type: boolean
        data_status:
          type: string
          enum:
          - computed
      required:
      - items
      - as_of
      - method
      - source
      - is_live
      - is_stale
      - data_status
    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        service:
          type: string
          enum:
          - parking-analytics
        status:
          type: string
          enum:
          - healthy
      required:
      - service
      - status
    ReadinessResponse:
      type: object
      additionalProperties: false
      properties:
        service:
          type: string
          enum:
          - parking-analytics
        status:
          type: string
          enum:
          - ready
      required:
      - service
      - status
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          description: Field path, when applicable.
        reason:
          type: string
          description: Stable machine-readable reason.
      required:
      - reason
    ErrorPayload:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        message:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        retryable:
          type: boolean
        source:
          type: string
          enum:
          - service
          - upstream
          - gateway
      required:
      - code
      - message
      - request_id
      - details
      - retryable
      - source
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorPayload'
      required:
      - error
  responses:
    BadRequest:
      description: Malformed HTTP or JSON request syntax.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            error:
              value:
                error:
                  code: BAD_REQUEST
                  message: Malformed HTTP or JSON request syntax.
                  request_id: req-s4-example
                  details: []
                  retryable: false
                  source: service
    Unauthorized:
      description: Credentials missing or invalid.
