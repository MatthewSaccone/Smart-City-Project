openapi: 3.1.0
info:
  title: Smart City — S1 Live Traffic Analytics API
  version: 1.0.0
  description: Contract for current route congestion and radius-based congestion queries. All successful timestamp outputs
    are ISO 8601 UTC with a Z suffix. This is a design contract; it does not assert implementation status.
servers:
- url: http://localhost:8081
  description: Example local service address (replace per deployment)
tags:
- name: Traffic
- name: Operations
paths:
  /v1/traffic/routes/congestion:
    post:
      tags:
      - Traffic
      operationId: getRouteCongestion
      summary: Estimate live congestion and delay on a route between two locations
      description: Calculates congestion without creating a resource. A routing dependency selects the fastest or shortest
        route between the points. Uses input observations received within the previous 60 seconds for fresh calculations.
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteRequest'
            examples:
              typical:
                value:
                  origin:
                    latitude: 43.0096
                    longitude: -81.2737
                  destination:
                    latitude: 43.015
                    longitude: -81.25
                  route_selection: fastest
      responses:
        '200':
          description: A route congestion estimate, possibly marked as cached/stale.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteCongestionResponse'
              examples:
                fresh:
                  value:
                    route:
                      origin:
                        latitude: 43.0096
                        longitude: -81.2737
                      destination:
                        latitude: 43.015
                        longitude: -81.25
                      route_selection: fastest
                      distance_m: 3200
                      congestion_level: moderate
                      baseline_duration_s: 420
                      estimated_duration_s: 570
                      estimated_delay_s: 150
                    as_of: '2026-11-10T18:00:00Z'
                    received_at: '2026-11-10T17:59:40Z'
                    service_updated_at: '2026-11-10T18:00:00Z'
                    source: traffic_feed
                    is_live: true
                    is_stale: false
                    data_status: live
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /v1/traffic/areas/congestion:
    get:
      tags:
      - Traffic
      operationId: listAreaCongestion
      summary: List congestion readings within a radius of a location
      description: Filters by geographic radius, sorts with segment_id as a tie-breaker, then paginates. Returns 200 with
        empty items when no segments match.
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - name: latitude
        in: query
        required: true
        schema:
          type: number
          minimum: -90
          maximum: 90
        description: Search center latitude (decimal degrees, WGS 84; finite).
      - name: longitude
        in: query
        required: true
        schema:
          type: number
          minimum: -180
          maximum: 180
        description: Search center longitude (decimal degrees, WGS 84; finite).
      - name: radius_m
        in: query
        required: true
        schema:
          type: number
          exclusiveMinimum: 0
          maximum: 10000
        description: Geographic search radius in metres (finite).
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: sort_by
        in: query
        schema:
          type: string
          enum:
          - distance_from_center_m
          - segment_id
          default: distance_from_center_m
      - name: sort_order
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
      responses:
        '200':
          description: A paginated list of congestion readings with freshness metadata.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaCongestionResponse'
              examples:
                fresh:
                  value:
                    items:
                    - segment_id: segment-123
                      center:
                        latitude: 43.0101
                        longitude: -81.2729
                      distance_from_center_m: 80
                      congestion_level: high
                    pagination:
                      limit: 25
                      offset: 0
                      total: 1
                      has_more: false
                    as_of: '2026-11-10T18:00:00Z'
                    received_at: '2026-11-10T17:59:40Z'
                    service_updated_at: '2026-11-10T18:00:00Z'
                    source: traffic_feed
                    is_live: true
                    is_stale: false
                    data_status: live
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /health:
    get:
      tags:
      - Operations
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process is responsive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                service: live-traffic
                status: healthy
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
  /ready:
    get:
      tags:
      - Operations
      operationId: getReadiness
      summary: Readiness probe (live snapshot or supported cached fallback)
      security: []
      responses:
        '200':
          description: Can respond to essential traffic-analytics requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                service: live-traffic
                status: ready
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Untrusted IDs are validated or replaced at trusted ingress.
      schema:
        type: string
        maxLength: 128
  headers:
    RequestId:
      description: Validated/generated request correlation identifier.
      schema:
        type: string
  schemas:
    Coordinate:
      type: object
      additionalProperties: false
      required:
      - latitude
      - longitude
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: WGS 84 decimal degrees; finite.
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: WGS 84 decimal degrees; finite.
    RouteRequest:
      type: object
      additionalProperties: false
      required:
      - origin
      - destination
      description: Origin and destination must be distinct coordinates.
      properties:
        origin:
          $ref: '#/components/schemas/Coordinate'
        destination:
          $ref: '#/components/schemas/Coordinate'
        route_selection:
          type: string
          enum:
          - fastest
          - shortest
          default: fastest
    CongestionLevel:
      type: string
      enum:
      - low
      - moderate
      - high
      - unknown
      description: Thresholds for each category are defined in the S1 calculation specification.
    RouteSummary:
      type: object
      additionalProperties: false
      required:
      - origin
      - destination
      - route_selection
      - distance_m
      - congestion_level
      - baseline_duration_s
      - estimated_duration_s
      - estimated_delay_s
      properties:
        origin:
          $ref: '#/components/schemas/Coordinate'
        destination:
          $ref: '#/components/schemas/Coordinate'
        route_selection:
          type: string
          enum:
          - fastest
          - shortest
        distance_m:
          type:
          - number
          - 'null'
          minimum: 0
          description: Distance along selected route
          in metres.: null
        congestion_level:
          $ref: '#/components/schemas/CongestionLevel'
        baseline_duration_s:
          type:
          - number
          - 'null'
          minimum: 0
        estimated_duration_s:
          type:
          - number
          - 'null'
          minimum: 0
        estimated_delay_s:
          type:
          - number
          - 'null'
          minimum: 0
          description: Nonnegative difference between estimated and baseline durations when both are available.
    FreshnessFields:
      type: object
      required:
      - as_of
      - received_at
      - service_updated_at
      - source
      - is_live
      - is_stale
      - data_status
      properties:
        as_of:
          type: string
          format: date-time
          description: UTC instant of calculation (Z suffix in output).
        received_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Last observation receipt time used; null if unknown.
        service_updated_at:
          type: string
          format: date-time
          description: UTC time when this result was last computed.
        source:
          type: string
          description: Configured public source identifier.
        is_live:
          type: boolean
        is_stale:
          type: boolean
        data_status:
          type: string
          enum:
          - live
          - cached
          - simulated
          description: Must correspond to actual origin and freshness.
    RouteCongestionResponse:
      allOf:
      - $ref: '#/components/schemas/FreshnessFields'
      - type: object
        required:
        - route
        properties:
          route:
            $ref: '#/components/schemas/RouteSummary'
      unevaluatedProperties: false
    AreaCongestionItem:
      type: object
      additionalProperties: false
      required:
      - segment_id
      - center
      - distance_from_center_m
      - congestion_level
      properties:
        segment_id:
          type: string
          minLength: 1
        center:
          $ref: '#/components/schemas/Coordinate'
        distance_from_center_m:
          type: number
          minimum: 0
        congestion_level:
          $ref: '#/components/schemas/CongestionLevel'
    Pagination:
      type: object
      additionalProperties: false
      required:
      - limit
      - offset
      - total
      - has_more
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
        total:
          type:
          - integer
          - 'null'
          minimum: 0
        has_more:
          type: boolean
    AreaCongestionResponse:
      allOf:
      - $ref: '#/components/schemas/FreshnessFields'
      - type: object
        required:
        - items
        - pagination
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/AreaCongestionItem'
          pagination:
            $ref: '#/components/schemas/Pagination'
      unevaluatedProperties: false
    HealthResponse:
      type: object
      additionalProperties: false
      required:
      - service
      - status
      properties:
        service:
          type: string
          const: live-traffic
        status:
          type: string
          const: healthy
    ReadyResponse:
      type: object
      additionalProperties: false
      required:
      - service
      - status
      properties:
        service:
          type: string
          const: live-traffic
        status:
          type: string
          const: ready
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
      - field
      - reason
      properties:
        field:
          type: string
        reason:
          type: string
    ApiError:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - request_id
      - details
      - retryable
      - source
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        message:
          type: string
        request_id:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        retryable:
          type: boolean
        source:
          type: string
          enum:
          - service
          - upstream
          - gateway
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
  responses:
    BadRequest:
      description: Malformed overall request (BAD_REQUEST).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: No traversable route is available (ROUTE_NOT_FOUND).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ValidationFailed:
      description: Invalid field, value, or field combination (VALIDATION_FAILED).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: VALIDATION_FAILED
              message: Latitude must be between -90 and 90.
              request_id: req-example-001
              details:
              - field: latitude
                reason: out_of_range
              retryable: false
              source: service
    RateLimited:
      description: Too many requests (RATE_LIMITED).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          description: Optional seconds until retry is permitted.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalError:
      description: Unexpected service failure (INTERNAL_ERROR).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UpstreamFailure:
      description: Upstream response invalid or unusable (UPSTREAM_FAILURE).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: Traffic service or required dependency unavailable (SERVICE_UNAVAILABLE).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UpstreamTimeout:
      description: Upstream provider timed out (UPSTREAM_TIMEOUT).
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
