openapi: 3.1.0
info:
  title: Smart City — S2 Traffic Predictor API
  version: 1.1.0
  description: Design API contract for recurring historical congestion and future point, area, and high-period
    predictions. Follows common Smart City API standards. It does not assert implementation status. Timestamp
    output uses UTC Z. All analytics require a trusted RS256 bearer access token; probes remain public.
servers:
- url: http://localhost:8082
  description: Illustrative service address; replaced by deployment service discovery.
tags:
- name: History
- name: Predictions
- name: Operations
paths:
  /v1/traffic/history/patterns:
    get:
      tags:
      - History
      operationId: listHistoricalPatterns
      summary: Return recurring congestion patterns for local weekday/hour buckets
      description: Read-only history query, grouped by requested IANA timezone. Uses sorted paginated result
        buckets. Accept start_at and end_at together, or omit both for the last 90 days. Max historical range
        365 days; timestamps not in the future.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Latitude'
      - $ref: '#/components/parameters/Longitude'
      - $ref: '#/components/parameters/OptionalRadius'
      - name: timezone
        in: query
        required: true
        schema:
          type: string
          example: America/Toronto
        description: IANA timezone for day/hour buckets; verified against timezone database.
      - name: day_of_week
        in: query
        required: false
        schema:
          type: string
          enum:
          - monday
          - tuesday
          - wednesday
          - thursday
          - friday
          - saturday
          - sunday
        description: Local day filter; omission selects all days.
      - name: local_hour
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          maximum: 23
        description: Local hour 0–23; omission selects all hours.
      - name: start_at
        in: query
        required: false
        schema:
          type: string
          format: date-time
          description: UTC ISO 8601 instant on output (Z); timezone-aware input instants are accepted.
        description: Optional historical start, inclusive; must be supplied with end_at.
      - name: end_at
        in: query
        required: false
        schema:
          type: string
          format: date-time
          description: UTC ISO 8601 instant on output (Z); timezone-aware input instants are accepted.
        description: Optional historical end, exclusive; must be supplied with start_at.
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - day_of_week
          - local_hour
          - average_congestion_score
          default: day_of_week
        description: Sort field; use weekday/hour as deterministic tie-breakers.
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        description: Sort direction.
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Matching recurring weekday/hour patterns, including provenance and pagination.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryPatternsResponse'
              examples:
                typical:
                  value:
                    items:
                    - day_of_week: monday
                      local_hour: 8
                      average_congestion_score: 0.78
                      congestion_level: high
                      observation_count: 124
                    pagination:
                      limit: 25
                      offset: 0
                      total: 1
                      has_more: false
                    timezone: America/Toronto
                    history_start_at: '2026-08-12T18:00:00Z'
                    history_end_at: '2026-11-10T18:00:00Z'
                    dataset_updated_at: '2026-11-10T16:00:00Z'
                    dataset_refresh_due_at: '2026-11-17T16:00:00Z'
                    as_of: '2026-11-10T18:00:00Z'
                    source: historical_traffic_dataset
                    is_live: false
                    is_stale: false
                    data_status: historical
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /v1/traffic/predictions:
    post:
      tags:
      - Predictions
      operationId: predictPointCongestion
      summary: Predict congestion for one location at a future time
      description: Read-only computation that creates no resource; repeat requests have no duplicate-write
        effect. Requires a validated, unexpired historical model.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PointPredictionRequest'
            examples:
              typical:
                value:
                  location:
                    latitude: 43.0096
                    longitude: -81.2737
                  forecast_time: '2026-11-12T17:00:00Z'
      responses:
        '200':
          description: A model-generated future point congestion estimate.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointPredictionResponse'
              examples:
                typical:
                  value:
                    prediction:
                      location:
                        latitude: 43.0096
                        longitude: -81.2737
                      forecast_time: '2026-11-12T17:00:00Z'
                      congestion_level: high
                      estimated_congestion_score: 0.82
                    generated_at: '2026-11-10T18:00:01Z'
                    model_version: traffic-model-1.0
                    training_data_end_at: '2026-11-09T23:59:59Z'
                    model_valid_until: '2026-12-10T00:00:00Z'
                    as_of: '2026-11-10T18:00:01Z'
                    source: historical_traffic_model
                    is_live: false
                    is_stale: false
                    data_status: predicted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /v1/traffic/predictions/high-congestion-periods:
    get:
      tags:
      - Predictions
      operationId: listHighCongestionPeriods
      summary: Identify high-congestion periods within an area and future time window
      description: Classifies 30-minute UTC-aligned forecast slots, merges adjacent high slots, clips to the
        requested window, then paginates. All intervals must be future, <= 48 hours long, and within the next
        seven days.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Latitude'
      - $ref: '#/components/parameters/Longitude'
      - $ref: '#/components/parameters/Radius'
      - name: start_at
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: UTC ISO 8601 instant on output (Z); timezone-aware input instants are accepted.
        description: Future start of search interval (inclusive).
      - name: end_at
        in: query
        required: true
        schema:
          type: string
          format: date-time
          description: UTC ISO 8601 instant on output (Z); timezone-aware input instants are accepted.
        description: Future end of search interval (exclusive); after start_at; <=48h range.
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - start_at
          - end_at
          default: start_at
        description: Stable tie-break using the other period boundary.
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        description: Sort direction.
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated high-congestion windows; an empty list means no high periods were predicted.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HighCongestionPeriodsResponse'
              examples:
                typical:
                  value:
                    items:
                    - start_at: '2026-11-12T16:00:00Z'
                      end_at: '2026-11-12T18:00:00Z'
                      congestion_level: high
                    pagination:
                      limit: 25
                      offset: 0
                      total: 1
                      has_more: false
                    generated_at: '2026-11-10T18:00:01Z'
                    model_version: traffic-model-1.0
                    training_data_end_at: '2026-11-09T23:59:59Z'
                    model_valid_until: '2026-12-10T00:00:00Z'
                    as_of: '2026-11-10T18:00:01Z'
                    source: historical_traffic_model
                    is_live: false
                    is_stale: false
                    data_status: predicted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /v1/traffic/predictions/areas:
    get:
      tags:
      - Predictions
      operationId: listAreaPredictions
      summary: Predict congestion for road segments within a geographic radius
      description: Filters road-segment representative points within the radius, sorts with segment_id tie-breaker,
        then paginates. Congestion level sorting is low, moderate, high, unknown.
      security:
      - BearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Latitude'
      - $ref: '#/components/parameters/Longitude'
      - $ref: '#/components/parameters/Radius'
      - $ref: '#/components/parameters/ForecastTime'
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - distance_from_center_m
          - segment_id
          - congestion_level
          default: distance_from_center_m
        description: Road segment sort field.
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        description: Sort direction.
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Paginated future congestion predictions for segments in the requested radius.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AreaPredictionsResponse'
              examples:
                typical:
                  value:
                    items:
                    - segment_id: segment-123
                      center:
                        latitude: 43.0101
                        longitude: -81.2729
                      distance_from_center_m: 80
                      forecast_time: '2026-11-12T17:00:00Z'
                      congestion_level: high
                      estimated_congestion_score: 0.82
                    pagination:
                      limit: 25
                      offset: 0
                      total: 1
                      has_more: false
                    generated_at: '2026-11-10T18:00:01Z'
                    model_version: traffic-model-1.0
                    training_data_end_at: '2026-11-09T23:59:59Z'
                    model_valid_until: '2026-12-10T00:00:00Z'
                    as_of: '2026-11-10T18:00:01Z'
                    source: historical_traffic_model
                    is_live: false
                    is_stale: false
                    data_status: predicted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /health:
    get:
      tags:
      - Operations
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Process responds without expensive dependency checks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                service: traffic-predictor
                status: healthy
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
      parameters:
      - $ref: '#/components/parameters/RequestId'
  /ready:
    get:
      tags:
      - Operations
      operationId: getReadiness
      summary: Readiness probe
      security: []
      description: Ready only when the service can provide essential predictions using a validated, unexpired
        model and adequate historical features or an explicitly approved fallback.
      responses:
        '200':
          description: Service can perform required prediction workloads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                service: traffic-predictor
                status: ready
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
        '503':
          $ref: '#/components/responses/Unavailable'
      parameters:
      - $ref: '#/components/parameters/RequestId'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Trusted RS256 access token, verified for issuer, audience, signature and expiry using the same identity provider as S3.
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Trusted ingress validates or replaces supplied IDs.
      schema:
        type: string
        maxLength: 128
    Latitude:
      name: latitude
      in: query
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
      description: Search center latitude, finite WGS 84 degrees.
    Longitude:
      name: longitude
      in: query
      required: true
      schema:
        type: number
        minimum: -180
        maximum: 180
      description: Search center longitude, finite WGS 84 degrees.
    Radius:
      name: radius_m
      in: query
      required: true
      schema:
        type: number
        exclusiveMinimum: 0
        maximum: 10000
      description: Positive finite radius in metres (T008 limit).
    OptionalRadius:
      name: radius_m
      in: query
      required: false
      schema:
        type: number
        exclusiveMinimum: 0
        maximum: 10000
        default: 500
      description: Positive finite radius in metres; default 500.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    ForecastTime:
      name: forecast_time
      in: query
      required: true
      schema:
        type: string
        format: date-time
        description: UTC ISO 8601 instant on output (Z); timezone-aware input instants are accepted.
      description: Future target instant; after request receipt and within seven days. Timezone required.
  headers:
    RequestId:
      description: Validated/generated request correlation ID.
      schema:
        type: string
  schemas:
    Coordinate:
      type: object
      additionalProperties: false
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
          description: Finite WGS 84 decimal latitude.
        longitude:
          type: number
          minimum: -180
          maximum: 180
          description: Finite WGS 84 decimal longitude.
      required:
      - latitude
      - longitude
    Pagination:
      type: object
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
        total:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          description: Exact count if available, otherwise null.
        has_more:
          type: boolean
      required:
      - limit
      - offset
      - total
      - has_more
    HistoricalPattern:
      type: object
      additionalProperties: false
      properties:
        day_of_week:
          type: string
          enum:
          - monday
          - tuesday
          - wednesday
          - thursday
          - friday
          - saturday
          - sunday
        local_hour:
          type: integer
          minimum: 0
          maximum: 23
        average_congestion_score: &id003
          anyOf:
          - type: number
            minimum: 0
            maximum: 1
          - type: 'null'
          description: Unitless score, not a calibrated probability; null indicates unknown/insufficient evidence.
        congestion_level: &id002
          type: string
          enum:
          - low
          - moderate
          - high
          - unknown
        observation_count:
          type: integer
          minimum: 0
      required:
      - day_of_week
      - local_hour
      - average_congestion_score
      - congestion_level
      - observation_count
      description: A historical local weekday/hour bucket. With zero observations the score is null and level
        unknown.
    HistoryPatternsResponse:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HistoricalPattern'
        pagination:
          $ref: '#/components/schemas/Pagination'
        timezone:
          type: string
          example: America/Toronto
          description: IANA time-zone identifier for day/hour grouping.
        history_start_at: &id001
          type: string
          format: date-time
          description: UTC ISO 8601 instant on output (Z); timezone-aware input instants are accepted.
        history_end_at: *id001
        dataset_updated_at: *id001
        dataset_refresh_due_at: *id001
        as_of: *id001
        source:
          type: string
          const: historical_traffic_dataset
        is_live:
          type: boolean
          const: false
        is_stale:
          type: boolean
          description: True when as_of > dataset_refresh_due_at.
        data_status:
          type: string
          const: historical
      required:
      - items
      - pagination
      - timezone
      - history_start_at
      - history_end_at
      - dataset_updated_at
      - dataset_refresh_due_at
      - as_of
      - source
      - is_live
      - is_stale
      - data_status
    PointPredictionRequest:
      type: object
      additionalProperties: false
      properties:
        location:
          $ref: '#/components/schemas/Coordinate'
        forecast_time: *id001
      required:
      - location
      - forecast_time
      description: No new resource is created. forecast_time must be future and at most seven days after receipt.
    PointPrediction:
      type: object
      additionalProperties: false
      properties:
        location:
          $ref: '#/components/schemas/Coordinate'
        forecast_time: *id001
        congestion_level: *id002
        estimated_congestion_score: *id003
      required:
      - location
      - forecast_time
      - congestion_level
      - estimated_congestion_score
      description: Model-generated estimate, not live traffic or calibrated correctness probability.
    PointPredictionResponse:
      type: object
      additionalProperties: false
      properties:
        prediction:
          $ref: '#/components/schemas/PointPrediction'
        generated_at: *id001
        model_version: &id004
          type: string
          minLength: 1
          description: Version of the validated forecasting model.
        training_data_end_at: *id001
        model_valid_until: *id001
        as_of: *id001
        source: &id005
          type: string
          const: historical_traffic_model
        is_live: &id006
          type: boolean
          const: false
        is_stale: &id007
          type: boolean
          description: True if model is past its validity deadline; normal newly generated predictions require
            false.
        data_status: &id008
          type: string
          const: predicted
      required:
      - prediction
      - generated_at
      - model_version
      - training_data_end_at
      - model_valid_until
      - as_of
      - source
      - is_live
      - is_stale
      - data_status
    HighCongestionPeriod:
      type: object
      additionalProperties: false
      properties:
        start_at: *id001
        end_at: *id001
        congestion_level:
          type: string
          const: high
      required:
      - start_at
      - end_at
      - congestion_level
      description: Contiguous forecast window classified high; timestamps are clipped to requested interval.
    HighCongestionPeriodsResponse:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/HighCongestionPeriod'
        pagination:
          $ref: '#/components/schemas/Pagination'
        generated_at: *id001
        model_version: *id004
        training_data_end_at: *id001
        model_valid_until: *id001
        as_of: *id001
        source: *id005
        is_live: *id006
        is_stale: *id007
        data_status: *id008
      required:
      - items
      - pagination
      - generated_at
      - model_version
      - training_data_end_at
      - model_valid_until
      - as_of
      - source
      - is_live
      - is_stale
      - data_status
    AreaPredictionItem:
      type: object
      additionalProperties: false
      properties:
        segment_id:
          type: string
          minLength: 1
          description: Stable opaque road-segment identifier.
        center:
          $ref: '#/components/schemas/Coordinate'
        distance_from_center_m:
          type: number
          minimum: 0
          description: Straight-line distance to representative segment point, metres.
        forecast_time: *id001
        congestion_level: *id002
        estimated_congestion_score: *id003
      required:
      - segment_id
      - center
      - distance_from_center_m
      - forecast_time
      - congestion_level
      - estimated_congestion_score
    AreaPredictionsResponse:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AreaPredictionItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
        generated_at: *id001
        model_version: *id004
        training_data_end_at: *id001
        model_valid_until: *id001
        as_of: *id001
        source: *id005
        is_live: *id006
        is_stale: *id007
        data_status: *id008
      required:
      - items
      - pagination
      - generated_at
      - model_version
      - training_data_end_at
      - model_valid_until
      - as_of
      - source
      - is_live
      - is_stale
      - data_status
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          minLength: 1
          description: Field path.
        reason:
          type: string
          minLength: 1
          description: Short safe reason.
      required:
      - field
      - reason
    ErrorCore:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          description: Stable application error code.
        message:
          type: string
          description: Safe human-readable error message.
        request_id:
          type: string
          description: Opaque identifier also returned in X-Request-ID.
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        retryable:
          type: boolean
        source:
          type: string
          enum:
          - service
          - upstream
          - gateway
      required:
      - code
      - message
      - request_id
      - details
      - retryable
      - source
    ErrorEnvelope:
      type: object
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorCore'
      required:
      - error
    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        service:
          type: string
          const: traffic-predictor
        status:
          type: string
          const: healthy
      required:
      - service
      - status
