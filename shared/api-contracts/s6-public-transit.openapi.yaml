  parameters:
    RequestId:
      in: header
      name: X-Request-ID
      required: false
      description: Optional untrusted input; ingress validates/replaces. Every response returns a trusted X-Request-ID.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Latitude:
      in: query
      name: latitude
      required: true
      schema:
        type: number
        minimum: -90
        maximum: 90
      description: WGS 84 geographic latitude (decimal degrees).
    Longitude:
      in: query
      name: longitude
      required: true
      schema:
        type: number
        minimum: -180
        maximum: 180
      description: WGS 84 geographic longitude (decimal degrees).
    Radius:
      in: query
      name: radius_m
      required: true
      schema:
        type: number
        exclusiveMinimum: 0
        maximum: 20000
      description: Radius in metres; maximum 20,000 m.
    Mode:
      in: query
      name: mode
      required: false
      schema:
        type: string
        enum:
        - bus
        - tram
        - train
      description: Filter to one of the v1 supported modes.
    Limit:
      in: query
      name: limit
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Offset:
      in: query
      name: offset
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    StopSearchSort:
      in: query
      name: sort_by
      required: false
      schema:
        type: string
        enum:
        - distance_m
        - name
        default: distance_m
      description: Default distance_m; tie-break by stop_id.
    RouteSearchSort:
      in: query
      name: sort_by
      required: false
      schema:
        type: string
        enum:
        - short_name
        - route_id
        default: short_name
      description: Default short_name; tie-break by route_id.
    SortOrderAsc:
      in: query
      name: sort_order
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
        default: asc
      description: Default asc.
    SortOrderDesc:
      in: query
      name: sort_order
      required: false
      schema:
        type: string
        enum:
        - asc
        - desc
        default: desc
      description: Default desc.
    StopId:
      in: path
      name: stop_id
      required: true
      schema: *id001
    RouteId:
      in: query
      name: route_id
      required: false
      schema: *id001
    StopFilter:
      in: query
      name: stop_id
      required: false
      schema: *id001
    VehicleFilter:
      in: query
      name: vehicle_id
      required: false
      schema: *id001
    StartAt:
      in: query
      name: start_at
      required: false
      schema: *id002
      description: Defaults to request time, at most 24 hours ahead, and not more than five minutes before request. Interval
        end must be inside valid schedule horizon.
    WindowMinutes:
      in: query
      name: window_minutes
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 180
        default: 60
    DelaySort:
      in: query
      name: sort_by
      required: false
      schema:
        type: string
        enum:
        - delay_seconds
        - event_at
        default: event_at
      description: Default event_at. Stable tie-break by trip_id and event_type.
    DisruptionSort:
      in: query
      name: sort_by
      required: false
      schema:
        type: string
        enum:
        - updated_at
        - starts_at
        default: updated_at
      description: Default updated_at; tie-break by disruption_id.
    DisruptionStatus:
      in: query
      name: status
      required: false
      schema:
        type: string
        enum:
        - active
        - planned
        - resolved
    DisruptionKind:
      in: query
      name: kind
      required: false
      schema:
        type: string
        enum:
        - disruption
        - cancellation
        - outage
        - detour
    OccupancySort:
      in: query
      name: sort_by
      required: false
      schema:
        type: string
        enum:
        - observed_at
        - route_id
        default: observed_at
      description: Default observed_at; tie-break by vehicle_id.
    ArrivalSort:
      name: sort_by
      in: query
      required: false
      description: Sort arrivals by the display time; ties use trip_id.
      schema:
        type: string
        enum:
        - display_at
        default: display_at
    ArrivalSortOrder:
      name: sort_order
      in: query
      required: false
      description: Sort direction; chronological ascending is the default.
      schema:
        type: string
        enum:
        - asc
        - desc
        default: asc
  responses:
    BadRequest:
      description: '400: Malformed request.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: BAD_REQUEST
              message: Malformed request.
              request_id: req-s6-001
              details: []
              retryable: false
              source: service
    NotFound:
      description: '404: Requested stop or resource does not exist.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: NOT_FOUND
              message: Requested stop or resource does not exist.
              request_id: req-s6-001
              details: []
              retryable: false
              source: service
    ValidationFailed:
      description: '422: Invalid or contradictory request parameter.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: VALIDATION_FAILED
              message: Invalid or contradictory request parameter.
              request_id: req-s6-001
              details: []
              retryable: false
              source: service
    RateLimited:
      description: '429: Rate limit exceeded.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: RATE_LIMITED
              message: Rate limit exceeded.
              request_id: req-s6-001
              details: []
              retryable: true
              source: service
    InternalError:
      description: '500: Unexpected service failure.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: INTERNAL_ERROR
              message: Unexpected service failure.
              request_id: req-s6-001
              details: []
              retryable: false
              source: service
    UpstreamFailure:
      description: '502: Invalid upstream transit data.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: UPSTREAM_FAILURE
              message: Invalid upstream transit data.
              request_id: req-s6-001
              details: []
              retryable: true
              source: upstream
    ServiceUnavailable:
      description: '503: Required schedule or provider data unavailable.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: Required schedule or provider data unavailable.
              request_id: req-s6-001
              details: []
              retryable: true
              source: service
    UpstreamTimeout:
      description: '504: Transit provider timed out.'
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: UPSTREAM_TIMEOUT
              message: Transit provider timed out.
              request_id: req-s6-001
              details: []
              retryable: true
              source: upstream
  headers:
    RequestId:
      description: Trusted correlation ID, also included in error bodies.
      schema:
        type: string
        minLength: 1
      example: req-s6-001
