openapi: 3.1.0
info:
  title: Smart City — S6 Public Transit Analysis API
  version: 1.0.0
  description: Design contract for S6. Fully conforms to adopted Smart City API Standards v1.0. PR1 FR1–FR5 and QR1–QR4
    mapped. No transit provider or operational deployment is claimed.
servers:
- url: https://api.example.invalid
  description: Placeholder only; replace with approved gateway URL.
tags:
- name: Public Transit
  description: Read-only public transport observations and schedules.
- name: Operations
  description: Operational monitoring endpoints, restricted by network policy.
paths:
  /v1/transit/stops:
    get:
      tags:
      - Public Transit
      operationId: listTransitStops
      summary: Find stops/stations near a point
      description: S6 FR5. Geodesic search radius <=20,000m. Filter by supported mode; stable sorting by distance or name
        then stop_id; apply pagination after filtering and sorting. Active schedule validity must cover the requested area.
        No JSON body.
      security: []
      x-pr1-requirements:
      - S6 FR5
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Latitude'
      - $ref: '#/components/parameters/Longitude'
      - $ref: '#/components/parameters/Radius'
      - $ref: '#/components/parameters/Mode'
      - $ref: '#/components/parameters/StopSearchSort'
      - $ref: '#/components/parameters/SortOrderAsc'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: '200 OK: Result with explicit source, coverage and time semantics.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopsResponse'
              examples:
                synthetic:
                  summary: Synthetic demonstration; no transit feed/provider confirmed
                  value:
                    items:
                    - stop_id: stop-102
                      name: Central Station
                      latitude: 43.0098
                      longitude: -81.2731
                      distance_m: 55
                      modes:
                      - bus
                      route_ids:
                      - route-5
                      - route-12
                    pagination:
                      limit: 25
                      offset: 0
                      total: 1
                      has_more: false
                    as_of: '2026-11-10T18:00:00Z'
                    source: example_schedule_feed
                    source_updated_at: '2026-11-10T10:00:00Z'
                    data_status: scheduled
                    is_live: false
                    is_stale: false
                    schedule_valid_through: '2026-12-31T23:59:59Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /v1/transit/routes:
    get:
      tags:
      - Public Transit
      operationId: listTransitRoutes
      summary: Find routes serving stops near a point
      description: S6 FR5. A route matches if at least one stop on its current published schedule is within the radius.
        Deduplicate and sort deterministically before pagination; v1 supports bus, train, tram modes.
      security: []
      x-pr1-requirements:
      - S6 FR5
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Latitude'
      - $ref: '#/components/parameters/Longitude'
      - $ref: '#/components/parameters/Radius'
      - $ref: '#/components/parameters/Mode'
      - $ref: '#/components/parameters/RouteSearchSort'
      - $ref: '#/components/parameters/SortOrderAsc'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: '200 OK: Result with explicit source, coverage and time semantics.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutesResponse'
              examples:
                synthetic:
                  summary: Synthetic demonstration; no transit feed/provider confirmed
                  value:
                    items:
                    - route_id: route-5
                      short_name: '5'
                      long_name: Central Express
                      mode: bus
                      agency_id: agency-example
                    pagination:
                      limit: 25
                      offset: 0
                      total: 1
                      has_more: false
                    as_of: '2026-11-10T18:00:00Z'
                    source: example_schedule_feed
                    source_updated_at: '2026-11-10T10:00:00Z'
                    data_status: scheduled
                    is_live: false
                    is_stale: false
                    schedule_valid_through: '2026-12-31T23:59:59Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /v1/transit/stops/{stop_id}/arrivals:
    get:
      tags:
      - Public Transit
      operationId: getStopArrivals
      summary: Upcoming arrival and departure schedule and estimates at a stop
      description: S6 FR1 and QR1–QR4. Response target <=1500ms, also with 50 concurrent prediction requests. Each arrival/departure
        has a scheduled timestamp plus optional fresh live estimate, display timestamp, and basis. Live data over 60 seconds
        old MUST NOT be exposed as current; serve schedule fallback when real-time feed fails. Query interval [start_at,
        start_at+window_minutes). Default stable order by display_at ascending, then trip_id; sort_order may reverse display_at
        order.
      security: []
      x-pr1-requirements:
      - S6 FR1
      - S6 QR1
      - S6 QR2
      - S6 QR3
      - S6 QR4
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/StopId'
      - $ref: '#/components/parameters/StartAt'
      - $ref: '#/components/parameters/WindowMinutes'
      - $ref: '#/components/parameters/RouteId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/ArrivalSort'
      - $ref: '#/components/parameters/ArrivalSortOrder'
      responses:
        '200':
          description: '200 OK: Result with explicit source, coverage and time semantics.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArrivalsResponse'
              examples:
                synthetic:
                  summary: Synthetic demonstration; no transit feed/provider confirmed
                  value:
                    stop_id: stop-102
                    as_of: '2026-11-10T18:00:00Z'
                    items:
                    - trip_id: trip-501
                      route_id: route-5
                      stop_id: stop-102
                      vehicle_id: vehicle-31
                      destination: West Terminal
                      arrival:
                        scheduled_at: '2026-11-10T18:10:00Z'
                        estimated_at: '2026-11-10T18:13:00Z'
                        display_at: '2026-11-10T18:13:00Z'
                        basis: live_estimate
                        delay_seconds: 180
                      departure:
                        scheduled_at: '2026-11-10T18:11:00Z'
                        estimated_at: '2026-11-10T18:14:00Z'
                        display_at: '2026-11-10T18:14:00Z'
                        basis: live_estimate
                        delay_seconds: 180
                    pagination:
                      limit: 25
                      offset: 0
                      total: 1
                      has_more: false
                    provenance:
                      last_live_update_at: '2026-11-10T17:59:35Z'
                      source_updated_at: '2026-11-10T17:59:35Z'
                      service_updated_at: '2026-11-10T17:59:40Z'
                      is_live: true
                      is_stale: false
                      live_update_status: fresh
                      data_status: live
                      source: example_transit_realtime_feed
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /v1/transit/delays:
    get:
      tags:
      - Public Transit
      operationId: listTransitDelays
      summary: Transit trip and vehicle delays
      description: S6 FR2/QR2. At least one of route_id or stop_id is required; both mean intersection. Only reliably observed/predicted
        positive delay_seconds are listed. Unknown live status MUST NOT be interpreted as no delays; coverage_status is
        explicit. Sort by event_at (default) or delay_seconds with deterministic tie-break.
      security: []
      x-pr1-requirements:
      - S6 FR2
      - S6 QR2
      - S6 QR3
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/RouteId'
      - $ref: '#/components/parameters/StopFilter'
      - $ref: '#/components/parameters/DelaySort'
      - $ref: '#/components/parameters/SortOrderDesc'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: '200 OK: Result with explicit source, coverage and time semantics.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelaysResponse'
              examples:
                synthetic:
                  summary: Synthetic demonstration; no transit feed/provider confirmed
                  value:
                    items:
                    - trip_id: trip-501
                      route_id: route-5
                      stop_id: stop-102
                      vehicle_id: vehicle-31
                      event_type: arrival
                      event_at: '2026-11-10T18:13:00Z'
                      delay_seconds: 180
                    pagination:
                      limit: 25
                      offset: 0
                      total: 1
                      has_more: false
                    as_of: '2026-11-10T18:00:00Z'
                    coverage_status: complete
                    provenance:
                      last_live_update_at: '2026-11-10T17:59:35Z'
                      source_updated_at: '2026-11-10T17:59:35Z'
                      service_updated_at: '2026-11-10T17:59:40Z'
                      is_live: true
                      is_stale: false
                      live_update_status: fresh
                      data_status: live
                      source: example_transit_realtime_feed
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /v1/transit/disruptions:
    get:
      tags:
      - Public Transit
      operationId: listTransitDisruptions
      summary: Transit cancellations, outages and advisories
      description: S6 FR3. At least one of route_id or stop_id required; optional kind and status. Stale cached alerts require
        explicit outdated status and original timestamps. If no trustworthy alert data exists, return an appropriate provider/service
        error instead of claiming there are no disruptions.
      security: []
      x-pr1-requirements:
      - S6 FR3
      - S6 QR2
      - S6 QR3
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/RouteId'
      - $ref: '#/components/parameters/StopFilter'
      - $ref: '#/components/parameters/DisruptionStatus'
      - $ref: '#/components/parameters/DisruptionKind'
      - $ref: '#/components/parameters/DisruptionSort'
      - $ref: '#/components/parameters/SortOrderDesc'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: '200 OK: Result with explicit source, coverage and time semantics.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisruptionsResponse'
              examples:
                synthetic:
                  summary: Synthetic demonstration; no transit feed/provider confirmed
                  value:
                    items:
                    - disruption_id: disruption-72
                      kind: cancellation
                      status: active
                      message: Selected service is cancelled.
                      route_ids:
                      - route-5
                      stop_ids:
                      - stop-102
                      starts_at: '2026-11-10T18:00:00Z'
                      ends_at: null
                      updated_at: '2026-11-10T17:59:20Z'
                    pagination:
                      limit: 25
                      offset: 0
                      total: 1
                      has_more: false
                    as_of: '2026-11-10T18:00:00Z'
                    coverage_status: complete
                    provenance:
                      last_live_update_at: '2026-11-10T17:59:20Z'
                      source_updated_at: '2026-11-10T17:59:20Z'
                      service_updated_at: '2026-11-10T17:59:25Z'
                      is_live: true
                      is_stale: false
                      live_update_status: fresh
                      data_status: live
                      source: example_transit_alerts_feed
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /v1/transit/occupancy:
    get:
      tags:
      - Public Transit
      operationId: listTransitOccupancy
      summary: Available vehicle or route passenger congestion measurements
      description: S6 FR4. At least one of route_id or vehicle_id required; both mean intersection. Occupancy count/capacity
        and percentages are nullable. Unknown occupancy MUST NOT be zero. A missing occupancy feed uses coverage_status
        unavailable and no claimed live count.
      security: []
      x-pr1-requirements:
      - S6 FR4
      - S6 QR2
      - S6 QR3
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/RouteId'
      - $ref: '#/components/parameters/VehicleFilter'
      - $ref: '#/components/parameters/OccupancySort'
      - $ref: '#/components/parameters/SortOrderDesc'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: '200 OK: Result with explicit source, coverage and time semantics.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OccupancyResponse'
              examples:
                synthetic:
                  summary: Synthetic demonstration; no transit feed/provider confirmed
                  value:
                    items:
                    - route_id: route-5
                      vehicle_id: vehicle-31
                      occupancy_level: moderate
                      passenger_count: null
                      capacity: null
                      occupancy_percent: null
                      observed_at: '2026-11-10T17:59:30Z'
                    pagination:
                      limit: 25
                      offset: 0
                      total: 1
                      has_more: false
                    as_of: '2026-11-10T18:00:00Z'
                    coverage_status: partial
                    provenance:
                      last_live_update_at: '2026-11-10T17:59:30Z'
                      source_updated_at: '2026-11-10T17:59:30Z'
                      service_updated_at: '2026-11-10T17:59:35Z'
                      is_live: true
                      is_stale: false
                      live_update_status: fresh
                      data_status: live
                      source: example_vehicle_occupancy_feed
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /health:
    get:
      tags:
      - Operations
      operationId: getHealth
      summary: Process liveness
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: '200 OK: service is healthy or ready.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                synthetic:
                  summary: Synthetic demonstration; no transit feed/provider confirmed
                  value:
                    service: transit-analytics
                    status: healthy
  /ready:
    get:
      tags:
      - Operations
      operationId: getReadiness
      summary: Readiness of persisted transit schedule and core schedule-backed operations
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: '200 OK: service is healthy or ready.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                synthetic:
                  summary: Synthetic demonstration; no transit feed/provider confirmed
                  value:
                    service: transit-analytics
                    status: ready
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  schemas:
    Pagination:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
        total:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        has_more: &id003
          type: boolean
      required:
      - limit
      - offset
      - total
      - has_more
      additionalProperties: false
    Stop:
      type: object
      properties:
        stop_id: &id001
          type: string
          minLength: 1
          maxLength: 128
          description: Opaque service-owned identifier.
        name:
          type: string
          minLength: 1
          maxLength: 256
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        distance_m:
          type: number
          minimum: 0
        modes:
          type: array
          items:
            type: string
            enum:
            - bus
            - tram
            - train
          uniqueItems: true
        route_ids:
          type: array
          items: *id001
          uniqueItems: true
      required:
      - stop_id
      - name
      - latitude
      - longitude
      - distance_m
      - modes
      - route_ids
      additionalProperties: false
    Route:
      type: object
      properties:
        route_id: *id001
        short_name:
          type: string
          minLength: 1
          maxLength: 64
        long_name:
          anyOf:
          - type: string
            maxLength: 256
          - type: 'null'
        mode:
          type: string
          enum:
          - bus
          - tram
          - train
        agency_id:
          anyOf:
          - *id001
          - type: 'null'
      required:
      - route_id
      - short_name
      - mode
      - agency_id
      additionalProperties: false
    TimeEstimate:
      type: object
      properties:
        scheduled_at: &id002
          type: string
          format: date-time
          description: Timezone-aware timestamp; output MUST be normalized to UTC with Z suffix.
        estimated_at:
          anyOf:
          - *id002
          - type: 'null'
        display_at: *id002
        basis:
          type: string
          enum:
          - schedule
          - live_estimate
        delay_seconds:
          anyOf:
          - type: integer
          - type: 'null'
      required:
      - scheduled_at
      - estimated_at
      - display_at
      - basis
      - delay_seconds
      additionalProperties: false
      description: If basis is schedule then estimated_at and delay_seconds must be null and display_at equals scheduled_at.
        If basis is live_estimate then estimated_at is non-null and display_at equals estimated_at. Signed delay is estimate
        minus schedule.
    ArrivalDeparture:
      type: object
      properties:
        trip_id: *id001
        route_id: *id001
        stop_id: *id001
        vehicle_id:
          anyOf:
          - *id001
          - type: 'null'
        destination:
          anyOf:
          - type: string
            maxLength: 256
          - type: 'null'
        arrival:
          anyOf:
          - $ref: '#/components/schemas/TimeEstimate'
          - type: 'null'
        departure:
          anyOf:
          - $ref: '#/components/schemas/TimeEstimate'
          - type: 'null'
      required:
      - trip_id
      - route_id
      - stop_id
      - vehicle_id
      - destination
      - arrival
      - departure
      additionalProperties: false
      description: At least one of arrival or departure must be present and non-null.
    Provenance:
      type: object
      properties:
        last_live_update_at:
          anyOf:
          - *id002
          - type: 'null'
        source_updated_at:
          anyOf:
          - *id002
          - type: 'null'
        service_updated_at:
          anyOf:
          - *id002
          - type: 'null'
        is_live: *id003
        is_stale: *id003
        live_update_status:
          type: string
          enum:
          - fresh
          - stale
          - unavailable
        data_status:
          type: string
          enum:
          - live
          - scheduled
          - cached
          - simulated
          - unavailable
        source:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - last_live_update_at
      - source_updated_at
      - service_updated_at
      - is_live
      - is_stale
      - live_update_status
      - data_status
      - source
      additionalProperties: false
      description: Fresh when known last_live_update_at is <=60 seconds old. Stale when >60 seconds. Missing or untrusted
        timestamp is unavailable (not fresh). Provider claims and any live predictions must be suppressed if source is stale/unavailable.
    DelayItem:
      type: object
      properties:
        trip_id: *id001
        route_id: *id001
        stop_id:
          anyOf:
          - *id001
          - type: 'null'
        vehicle_id:
          anyOf:
          - *id001
          - type: 'null'
        event_type:
          type: string
          enum:
          - arrival
          - departure
        event_at: *id002
        delay_seconds:
          type: integer
          minimum: 1
      required:
      - trip_id
      - route_id
      - stop_id
      - vehicle_id
      - event_type
      - event_at
      - delay_seconds
      additionalProperties: false
    Disruption:
      type: object
      properties:
        disruption_id: *id001
        kind:
          type: string
          enum:
          - disruption
          - cancellation
          - outage
          - detour
        status:
          type: string
          enum:
          - active
          - planned
          - resolved
        message:
          type: string
          minLength: 1
          maxLength: 1000
        route_ids:
          type: array
          items: *id001
          uniqueItems: true
        stop_ids:
          type: array
          items: *id001
          uniqueItems: true
        starts_at: *id002
        ends_at:
          anyOf:
          - *id002
          - type: 'null'
        updated_at: *id002
      required:
      - disruption_id
      - kind
      - status
      - message
      - route_ids
      - stop_ids
      - starts_at
      - ends_at
      - updated_at
      additionalProperties: false
    Occupancy:
      type: object
      properties:
        route_id: *id001
        vehicle_id:
          anyOf:
          - *id001
          - type: 'null'
        occupancy_level:
          type: string
          enum:
          - low
          - moderate
          - high
          - full
          - unknown
        passenger_count:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        capacity:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        occupancy_percent:
          anyOf:
          - type: number
            minimum: 0
            maximum: 100
          - type: 'null'
        observed_at: *id002
