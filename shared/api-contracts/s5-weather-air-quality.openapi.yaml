openapi: 3.1.0
info:
  title: Smart City — S5 Weather & Air Quality API
  version: 1.0.0
  description: T008 prescriptive interface contract for S5 (weather-analytics), grounded in PR1 S5 FR1-FR5 and QR1-QR3.
    PR1 target is <=2000 ms. Weather outage returns last known data clearly marked stale. Freshness cutoffs 30 min weather,
    60 min AQ, 6 h forecast are adopted S5 design choices, not PR1 numeric targets. Provider selections remain unconfirmed.
    All outputs use UTC RFC3339 Z. Follows docs/api/API-Standards.md.
tags:
- name: Weather
  description: Current weather and weather forecast reads
- name: Environment
  description: Air-quality measurements and historical environmental trends
- name: Guidance
  description: Derived weather-related travel precautions, not an official safety guarantee
- name: Operations
  description: Process liveness and service readiness
paths:
  /v1/weather/current:
    get:
      tags:
      - Weather
      operationId: getCurrentWeather
      summary: Get current weather conditions at a point
      description: S5 FR1/FR3, QR1-QR3. Return latest usable observation including humidity; cached stale fallback on provider
        failure. Do not replace missing measurements with zero.
      x-pr1-requirements:
      - S5 FR1
      - S5 FR3
      - S5 QR1
      - S5 QR2
      - S5 QR3
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Latitude'
      - $ref: '#/components/parameters/Longitude'
      responses:
        '200':
          description: '200 OK: successful result with explicit source and time semantics.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentWeatherResponse'
              examples:
                synthetic:
                  summary: Illustrative synthetic response; provider not selected
                  value:
                    location: &id001
                      latitude: 43.0096
                      longitude: -81.2737
                    as_of: '2026-11-10T18:00:00Z'
                    weather:
                      temperature_c: 7.5
                      feels_like_c: 5.4
                      relative_humidity_pct: 72
                      precipitation_rate_mm_h: 0
                      wind_speed_m_s: 4.2
                      wind_gust_m_s: 7.1
                      visibility_m: 650
                      condition_code: fog
                    provenance:
                      observed_at: '2026-11-10T17:55:00Z'
                      source_updated_at: '2026-11-10T17:56:00Z'
                      service_updated_at: '2026-11-10T17:56:05Z'
                      is_live: true
                      is_stale: false
                      source: example_weather_feed
                      data_status: live
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /v1/weather/forecast:
    get:
      tags:
      - Weather
      operationId: getWeatherForecast
      summary: Get weather forecasts for a future interval
      description: S5 FR2, QR1-QR3. Future [start_at,end_at) time bounds within seven days; issued_at is distinct from predicted
        valid times. Deterministic sorting, by valid_from then valid_to by default, before offset pagination; 200 with empty
        items if supported coverage exists but no interval matches. Six-hour forecast-issuance freshness threshold.
      x-pr1-requirements:
      - S5 FR2
      - S5 QR1
      - S5 QR2
      - S5 QR3
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Latitude'
      - $ref: '#/components/parameters/Longitude'
      - $ref: '#/components/parameters/ForecastStart'
      - $ref: '#/components/parameters/ForecastEnd'
      - $ref: '#/components/parameters/Resolution'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/ForecastSortBy'
      - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          description: '200 OK: successful result with explicit source and time semantics.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForecastResponse'
              examples:
                synthetic:
                  summary: Illustrative synthetic response; provider not selected
                  value:
                    location: *id001
                    as_of: '2026-11-10T18:00:00Z'
                    items:
                    - valid_from: '2026-11-12T12:00:00Z'
                      valid_to: '2026-11-12T13:00:00Z'
                      temperature_c: 4.0
                      precipitation_probability_pct: 65
                      wind_speed_m_s: 8
                      condition_code: rain
                    pagination:
                      limit: 25
                      offset: 0
                      total: 1
                      has_more: false
                    resolution: hourly
                    issued_at: '2026-11-10T15:00:00Z'
                    source_updated_at: '2026-11-10T15:01:00Z'
                    service_updated_at: '2026-11-10T15:01:10Z'
                    is_live: true
                    is_stale: false
                    source: example_forecast_feed
                    data_status: live
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /v1/environment/air-quality:
    get:
      tags:
      - Environment
      operationId: getAirQuality
      summary: Get AQHI and pollutant observations at a point
      description: S5 FR3/QR1/QR2. AQHI nullable when unavailable; pollutant units fixed per pollutant. Weather may remain
        available when AQ data is unavailable; live AQ observations fresh up to 60 minutes.
      x-pr1-requirements:
      - S5 FR3
      - S5 QR1
      - S5 QR2
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Latitude'
      - $ref: '#/components/parameters/Longitude'
      responses:
        '200':
          description: '200 OK: successful result with explicit source and time semantics.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AirQualityResponse'
              examples:
                synthetic:
                  summary: Illustrative synthetic response; provider not selected
                  value:
                    location: *id001
                    as_of: '2026-11-10T18:00:00Z'
                    air_quality_index:
                      system: ca_aqhi
                      value: 4.0
                      category: moderate
                    pollutants:
                    - pollutant: pm2_5
                      concentration: 12.5
                      unit: ug_m3
                    - pollutant: o3
                      concentration: 28
                      unit: ppb
                    provenance:
                      observed_at: '2026-11-10T17:30:00Z'
                      source_updated_at: '2026-11-10T17:35:00Z'
                      service_updated_at: '2026-11-10T17:35:10Z'
                      is_live: true
                      is_stale: false
                      source: example_air_quality_feed
                      data_status: live
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /v1/environment/trends:
    get:
      tags:
      - Environment
      operationId: getEnvironmentalTrends
      summary: Get historical environment measurements in time buckets
      description: 'S5 service description: environmental trends. Time period <= 7 days, within past 30 days; hourly/daily
        UTC buckets; metric-specific units; historical not live; partial coverage explicit. Deterministic sorting, by period_start
        then period_end by default, before offset pagination.'
      x-pr1-requirements:
      - S5 FR3
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Latitude'
      - $ref: '#/components/parameters/Longitude'
      - $ref: '#/components/parameters/Metric'
      - $ref: '#/components/parameters/TrendStart'
      - $ref: '#/components/parameters/TrendEnd'
      - $ref: '#/components/parameters/Resolution'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      - $ref: '#/components/parameters/TrendSortBy'
      - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          description: '200 OK: successful result with explicit source and time semantics.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendResponse'
              examples:
                synthetic:
                  summary: Illustrative synthetic response; provider not selected
                  value:
                    location: *id001
                    metric: pm2_5_ug_m3
                    resolution: hourly
                    items:
                    - period_start: '2026-11-09T16:00:00Z'
                      period_end: '2026-11-09T17:00:00Z'
                      value: 9.5
                      unit: ug_m3
                      sample_count: 3
                    - period_start: '2026-11-09T17:00:00Z'
                      period_end: '2026-11-09T18:00:00Z'
                      value: null
                      unit: ug_m3
                      sample_count: 0
                    pagination:
                      limit: 25
                      offset: 0
                      total: 2
                      has_more: false
                    coverage_status: partial
                    dataset_updated_at: '2026-11-10T17:00:00Z'
                    as_of: '2026-11-10T18:00:00Z'
                    source: example_environment_history
                    is_live: false
                    is_stale: false
                    data_status: historical
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /v1/weather/travel-guidance:
    get:
      tags:
      - Guidance
      operationId: getWeatherTravelGuidance
      summary: Get derived weather-related travel risk and precautions
      description: S5 FR4/FR5, QR1-QR3. Current or future travel instant up to 7 days. Derived from weather/forecast/AQ
        measurements, not an official alert. Return risk unknown and assessment insufficient_data when essential inputs
        absent or too stale; the rule-set thresholds require a separately approved specification.
      x-pr1-requirements:
      - S5 FR4
      - S5 FR5
      - S5 QR1
      - S5 QR2
      - S5 QR3
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/Latitude'
      - $ref: '#/components/parameters/Longitude'
      - $ref: '#/components/parameters/TravelAt'
      responses:
        '200':
          description: '200 OK: successful result with explicit source and time semantics.'
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelGuidanceResponse'
              examples:
                synthetic:
                  summary: Illustrative synthetic response; provider not selected
                  value:
                    location: *id001
                    travel_at: '2026-11-10T18:00:00Z'
                    as_of: '2026-11-10T18:00:00Z'
                    assessment_status: assessed
                    risk_level: moderate
                    hazards:
                    - hazard_type: reduced_visibility
                      severity: moderate
                      description: Visibility may be reduced in fog.
                    recommendations:
                    - Allow additional travel time and monitor official weather advisories.
                    rule_set_version: weather_travel_rules_v1
                    inputs:
                    - dataset: weather_observation
                      reference_at: '2026-11-10T17:55:00Z'
                      is_stale: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'
  /health:
    get:
      tags:
      - Operations
      operationId: getHealth
      summary: Process liveness
      description: No expensive dependency checks.
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Operational probe success.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                synthetic:
                  summary: Illustrative synthetic response; provider not selected
                  value:
                    service: weather-analytics
                    status: healthy
  /ready:
    get:
      tags:
      - Operations
      operationId: getReadiness
      summary: Essential weather query/cached-fallback capability
      description: Ready when usable weather or a candid cached weather fallback can be returned; provider outage alone
        need not fail readiness. Missing AQ alone does not fail full-service readiness.
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Operational probe success.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                synthetic:
                  summary: Illustrative synthetic response; provider not selected
                  value:
                    service: weather-analytics
                    status: ready
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Optional caller-supplied ID; untrusted IDs must be validated or replaced at ingress.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Latitude:
      name: latitude
      in: query
      required: true
      description: WGS 84 latitude in decimal degrees.
      schema: &id003
        type: number
        description: WGS 84 decimal degrees.
        minimum: -90
        maximum: 90
      example: 43.0096
    Longitude:
      name: longitude
      in: query
      required: true
      description: WGS 84 longitude in decimal degrees.
      schema: &id004
        type: number
        description: WGS 84 decimal degrees.
        minimum: -180
        maximum: 180
      example: -81.2737
    ForecastStart:
      name: start_at
      in: query
      required: true
      description: Timezone-aware timestamp at/after request receipt.
      schema: &id002
        type: string
        description: Timezone-aware ISO 8601/RFC 3339 timestamp. Output MUST use UTC Z.
        format: date-time
      example: '2026-11-12T12:00:00Z'
    ForecastEnd:
      name: end_at
      in: query
      required: true
      description: Timezone-aware timestamp strictly after start_at and no later than 7 days after request receipt.
      schema: *id002
      example: '2026-11-12T14:00:00Z'
    TrendStart:
      name: start_at
      in: query
      required: true
      description: Historical start, within 30 days preceding receipt; range length at most 7 days.
      schema: *id002
      example: '2026-11-09T16:00:00Z'
    TrendEnd:
      name: end_at
      in: query
      required: true
      description: Historical end strictly after start_at and no later than request receipt.
      schema: *id002
      example: '2026-11-09T18:00:00Z'
    Resolution:
      name: resolution
      in: query
      required: false
      description: Interval resolution; timeline uses UTC boundaries.
      schema:
        type: string
        enum: &id007
        - hourly
        - daily
        default: hourly
    Limit:
      name: limit
      in: query
      required: false
      description: Default 25, maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Metric:
      name: metric
      in: query
      required: true
      description: One of the explicitly supported trend metrics.
      schema: &id009
        type: string
        enum:
        - temperature_c
        - relative_humidity_pct
        - pm2_5_ug_m3
        - aqhi
    TravelAt:
      name: travel_at
      in: query
      required: false
      description: Defaults to request receipt time; at most seven days ahead.
      schema: *id002
    ForecastSortBy:
      name: sort_by
      in: query
      required: false
      description: Forecast interval ordering field. Stable tie-breaker is valid_to.
      schema:
        type: string
        enum:
        - valid_from
        - valid_to
        default: valid_from
    TrendSortBy:
      name: sort_by
      in: query
      required: false
      description: Historical interval ordering field. Stable tie-breaker is period_end.
      schema:
        type: string
        enum:
        - period_start
        - period_end
        default: period_start
    SortOrder:
      name: sort_order
      in: query
      required: false
      description: Sort direction for the selected field.
      schema:
        type: string
        enum:
        - asc
        - desc
        default: asc
  headers:
    RequestId:
      description: Trusted request correlation ID echoed in error bodies.
      schema:
        type: string
        minLength: 1
      example: req-s5-001
  responses:
    BadRequest:
      description: 400 — Malformed request. Uses the standardized Smart City error envelope.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: BAD_REQUEST
              message: Malformed request.
              request_id: req-s5-001
              details: []
              retryable: false
              source: service
    NotFound:
      description: 404 — Location outside service coverage. Uses the standardized Smart City error envelope.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: NOT_FOUND
              message: Location outside service coverage.
              request_id: req-s5-001
              details: []
              retryable: false
              source: service
    ValidationFailed:
      description: 422 — Invalid or contradictory parameters. Uses the standardized Smart City error envelope.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: VALIDATION_FAILED
              message: Invalid or contradictory parameters.
              request_id: req-s5-001
              details: []
              retryable: false
              source: service
    RateLimited:
      description: 429 — Request rate limit exceeded. Uses the standardized Smart City error envelope.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: RATE_LIMITED
              message: Request rate limit exceeded.
              request_id: req-s5-001
              details: []
              retryable: true
              source: service
    InternalError:
      description: 500 — Unexpected internal failure. Uses the standardized Smart City error envelope.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: INTERNAL_ERROR
              message: Unexpected internal failure.
              request_id: req-s5-001
              details: []
              retryable: false
              source: service
    UpstreamFailure:
      description: 502 — External provider returned unusable data. Uses the standardized Smart City error envelope.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: UPSTREAM_FAILURE
              message: External provider returned unusable data.
              request_id: req-s5-001
              details: []
              retryable: true
              source: upstream
    Unavailable:
      description: 503 — Required service data is unavailable. Uses the standardized Smart City error envelope.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: Required service data is unavailable.
              request_id: req-s5-001
              details: []
              retryable: true
              source: service
    UpstreamTimeout:
      description: 504 — External provider timed out. Uses the standardized Smart City error envelope.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: UPSTREAM_TIMEOUT
              message: External provider timed out.
              request_id: req-s5-001
              details: []
              retryable: true
              source: upstream
  schemas:
    Location:
      type: object
      additionalProperties: false
      properties:
        latitude: *id003
        longitude: *id004
      required:
      - latitude
      - longitude
    Pagination:
      type: object
      additionalProperties: false
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
        total:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        has_more:
          type: boolean
      required:
      - limit
      - offset
      - total
      - has_more
      description: Standard offset metadata; null total only if an exact total is unavailable. If total null, has_more from
        an extra result.
    Provenance:
      type: object
      additionalProperties: false
      properties:
        observed_at: &id005
          anyOf:
          - *id002
          - type: 'null'
        source_updated_at: *id005
        service_updated_at: *id005
        is_live:
          type: boolean
        is_stale:
          type: boolean
        source:
          type: string
          minLength: 1
        data_status: &id008
          type: string
          enum:
          - live
          - cached
          - historical
          - simulated
          - unavailable
      required:
      - observed_at
      - source_updated_at
      - service_updated_at
      - is_live
      - is_stale
      - source
      - data_status
      description: Age of current weather/air quality is evaluated from observed_at; missing timestamp cannot be represented
        as fresh. A cached fallback is not a live response.
    WeatherMeasurements:
      type: object
      additionalProperties: false
      properties:
        temperature_c:
          anyOf:
          - type: number
            description: Degrees Celsius.
          - type: 'null'
        feels_like_c:
          anyOf:
          - type: number
            description: Degrees Celsius.
          - type: 'null'
        relative_humidity_pct:
          anyOf:
          - type: number
            description: Percentage points.
            minimum: 0
            maximum: 100
          - type: 'null'
        precipitation_rate_mm_h:
          anyOf:
          - type: number
            description: Millimetres per hour.
            minimum: 0
          - type: 'null'
        wind_speed_m_s:
          anyOf:
          - type: number
            description: Metres per second.
            minimum: 0
          - type: 'null'
        wind_gust_m_s:
          anyOf:
          - type: number
            description: Metres per second.
            minimum: 0
          - type: 'null'
        visibility_m:
          anyOf:
          - type: number
            description: Metres.
            minimum: 0
          - type: 'null'
        condition_code: &id006
          type: string
          enum:
          - clear
          - cloudy
          - rain
          - snow
          - mixed_precipitation
          - fog
          - thunderstorm
          - windy
          - unknown
      required:
      - temperature_c
      - feels_like_c
      - relative_humidity_pct
      - precipitation_rate_mm_h
      - wind_speed_m_s
      - wind_gust_m_s
      - visibility_m
      - condition_code
      description: Unavailable measurement is null; not zero.
    CurrentWeatherResponse:
      type: object
      additionalProperties: false
      properties:
        location:
          $ref: '#/components/schemas/Location'
        as_of: *id002
        weather:
          $ref: '#/components/schemas/WeatherMeasurements'
        provenance:
          $ref: '#/components/schemas/Provenance'
      required:
      - location
      - as_of
      - weather
      - provenance
    ForecastInterval:
      type: object
      additionalProperties: false
      properties:
        valid_from: *id002
        valid_to: *id002
        temperature_c:
          anyOf:
          - type: number
            description: Degrees Celsius.
          - type: 'null'
        precipitation_probability_pct:
          anyOf:
          - type: number
            description: Percentage points.
            minimum: 0
            maximum: 100
          - type: 'null'
        wind_speed_m_s:
          anyOf:
          - type: number
            description: Metres per second.
            minimum: 0
          - type: 'null'
        condition_code: *id006
      required:
      - valid_from
      - valid_to
      - temperature_c
      - precipitation_probability_pct
      - wind_speed_m_s
      - condition_code
      description: Forecast interval; valid_to must be after valid_from; values may be null when a particular variable is
        unavailable.
    ForecastResponse:
      type: object
      additionalProperties: false
      properties:
        location:
          $ref: '#/components/schemas/Location'
        as_of: *id002
        items:
          type: array
          items:
            $ref: '#/components/schemas/ForecastInterval'
        pagination:
          $ref: '#/components/schemas/Pagination'
        resolution: &id010
          type: string
          enum: *id007
        issued_at: *id005
        source_updated_at: *id005
        service_updated_at: *id005
        is_live:
          type: boolean
        is_stale:
          type: boolean
        source:
          type: string
          minLength: 1
        data_status: *id008
      required:
      - location
      - as_of
      - items
      - pagination
      - resolution
      - issued_at
      - source_updated_at
      - service_updated_at
      - is_live
      - is_stale
      - source
      - data_status
      description: Sorted by valid_from then valid_to; forecast age measured from issued_at.
    AirQualityIndex:
      type: object
      additionalProperties: false
      properties:
        system:
          type: string
          enum:
          - ca_aqhi
        value:
          type: number
          minimum: 0
        category:
          type: string
          enum:
          - low
          - moderate
          - high
          - very_high
      required:
      - system
      - value
      - category
      description: Canadian Air Quality Health Index, not US AQI; null if an AQHI is not available.
    PollutantReading:
      type: object
      additionalProperties: false
      properties:
        pollutant:
          type: string
          enum:
          - pm2_5
          - pm10
          - o3
          - no2
          - so2
          - co
        concentration:
          type: number
          description: Nonnegative measured concentration.
          minimum: 0
        unit:
          type: string
          enum:
          - ug_m3
          - ppb
          - ppm
      required:
      - pollutant
      - concentration
      - unit
      description: Unit MUST be ug_m3 for PM2.5/PM10, ppb for ozone/NO2/SO2, or ppm for CO; the service must convert raw
        provider units.
    AirQualityResponse:
      type: object
      additionalProperties: false
      properties:
        location:
          $ref: '#/components/schemas/Location'
        as_of: *id002
        air_quality_index:
          anyOf:
          - $ref: '#/components/schemas/AirQualityIndex'
          - type: 'null'
        pollutants:
          type: array
          items:
            $ref: '#/components/schemas/PollutantReading'
        provenance:
          $ref: '#/components/schemas/Provenance'
      required:
      - location
      - as_of
      - air_quality_index
      - pollutants
      - provenance
    TrendBucket:
      type: object
      additionalProperties: false
      properties:
        period_start: *id002
        period_end: *id002
        value:
          anyOf:
          - type: number
            description: Arithmetic mean of valid source observations; null for a missing bucket.
          - type: 'null'
        unit:
          type: string
          enum:
          - c
          - pct
          - ug_m3
          - aqhi
        sample_count:
          type: integer
          minimum: 0
      required:
      - period_start
      - period_end
      - value
      - unit
      - sample_count
      description: Period must be a valid half-open UTC interval. Unit depends on requested metric.
    TrendResponse:
      type: object
      additionalProperties: false
      properties:
        location:
          $ref: '#/components/schemas/Location'
        metric: *id009
        resolution: *id010
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrendBucket'
        pagination:
          $ref: '#/components/schemas/Pagination'
        coverage_status:
          type: string
          enum:
          - complete
          - partial
          - unavailable
        dataset_updated_at: *id005
        as_of: *id002
        source:
          type: string
          minLength: 1
        is_live:
          type: boolean
        is_stale:
          type: boolean
        data_status:
          type: string
          enum:
          - historical
      required:
      - location
      - metric
      - resolution
      - items
      - pagination
      - coverage_status
      - dataset_updated_at
      - as_of
      - source
      - is_live
      - is_stale
      - data_status
      description: Historic trend data is historical even when recently refreshed; partial coverage is reported separately
        from live freshness.
    TravelHazard:
      type: object
      additionalProperties: false
      properties:
        hazard_type:
          type: string
          enum:
          - reduced_visibility
          - heavy_precipitation
          - strong_wind
          - icy_conditions
          - extreme_heat
          - extreme_cold
          - poor_air_quality
        severity:
          type: string
          enum:
          - moderate
          - high
        description:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - hazard_type
      - severity
      - description
    TravelInput:
      type: object
      additionalProperties: false
      properties:
        dataset:
          type: string
          enum:
          - weather_observation
          - weather_forecast
          - air_quality
        reference_at: *id005
        is_stale:
          type: boolean
      required:
      - dataset
      - reference_at
      - is_stale
      description: Reference time is observed_at for measured inputs or issued_at for forecasts.
    TravelGuidanceResponse:
      type: object
      additionalProperties: false
      properties:
        location:
          $ref: '#/components/schemas/Location'
        travel_at: *id002
        as_of: *id002
        assessment_status:
          type: string
          enum:
          - assessed
          - insufficient_data
        risk_level:
          type: string
          enum:
          - low
          - moderate
          - high
          - unknown
        hazards:
          type: array
          items:
            $ref: '#/components/schemas/TravelHazard'
        recommendations:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 500
        rule_set_version:
          type: string
          minLength: 1
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/TravelInput'
      required:
      - location
      - travel_at
      - as_of
      - assessment_status
      - risk_level
      - hazards
      - recommendations
      - rule_set_version
      - inputs
      description: Risk is informational weather-related difficulty, not a declaration that travel is safe. If essential
        evidence insufficient, status insufficient_data and risk unknown.
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
      required:
      - field
      - reason
    ErrorEnvelope:
      type: object
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/Error'
      required:
      - error
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        message:
          type: string
          minLength: 1
        request_id:
          type: string
          minLength: 1
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        retryable:
          type: boolean
        source:
          type: string
          enum:
          - service
          - upstream
          - gateway
      required:
      - code
      - message
      - request_id
      - details
      - retryable
      - source
    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        service:
          type: string
          enum:
          - weather-analytics
        status:
          type: string
          enum:
          - healthy
      required:
      - service
      - status
    ReadyResponse:
      type: object
      additionalProperties: false
      properties:
        service:
          type: string
          enum:
          - weather-analytics
        status:
          type: string
          enum:
          - ready
      required:
      - service
      - status
