
global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode http
    option httplog
    option dontlognull

    timeout connect 3s
    timeout check 1s
    timeout client 30s
    timeout server 30s

frontend registry_frontend
    bind *:8080
    default_backend registry_backends

backend registry_backends
    balance roundrobin

    option httpchk GET /health
    option log-health-checks
    http-check expect status 200

    default-server inter 2s fastinter 500ms fall 2 rise 2

    server registry1 registry-1:8080 check resolvers docker init-addr libc,none
    server registry2 registry-2:8080 check resolvers docker init-addr libc,none

resolvers docker
    nameserver docker_dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
