
name: smart-city-microservices

services:
  # Dedicated PostgreSQL database for Keycloak
  keycloak-postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}

    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U keycloak -d keycloak
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Shared identity provider for all seven microservices
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command:
      - start-dev
      - --http-port=8080

    restart: unless-stopped

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}

      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}

      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8088
      KC_HOSTNAME_STRICT: "false"

    depends_on:
      keycloak-postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:8088:8080"
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: smart_city_registry
      POSTGRES_USER: registry_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U registry_user -d smart_city_registry
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  
  # Dedicated PostgreSQL/PostGIS database for Construction & Incidents
  incidents-postgres:
    image: postgis/postgis:16-3.5
    restart: unless-stopped

    environment:
      POSTGRES_DB: smart_city_incidents
      POSTGRES_USER: incidents_user
      POSTGRES_PASSWORD: ${INCIDENTS_POSTGRES_PASSWORD:?Set INCIDENTS_POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - incidents-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U incidents_user -d smart_city_incidents
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


  # First registry API instance
  registry-1:
    build:
      context: ./service-registry
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:?Set REGISTRY_API_KEY in .env}
      REGISTRY_DATABASE_URL: postgresql://registry_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/smart_city_registry
      REGISTRY_HEARTBEAT_INTERVAL_SECONDS: "5"
      REGISTRY_EXPIRY_SCAN_SECONDS: "1"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Second registry API instance
  registry-2:
    build:
      context: ./service-registry
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:?Set REGISTRY_API_KEY in .env}
      REGISTRY_DATABASE_URL: postgresql://registry_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/smart_city_registry
      REGISTRY_HEARTBEAT_INTERVAL_SECONDS: "5"
      REGISTRY_EXPIRY_SCAN_SECONDS: "1"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # HAProxy registry gateway
  service-registry:
    image: haproxy:3.0-alpine
    restart: unless-stopped

    ports:
      - "8090:8080"

    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

    depends_on:
      registry-1:
        condition: service_healthy
      registry-2:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Live traffic analytics
  live-traffic:
    build:
      context: ./services
      dockerfile: live-traffic/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: development
      REGISTRY_URL: http://service-registry:8080
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:?Set REGISTRY_API_KEY in .env}
      REGISTRY_ADVERTISED_ENDPOINT: http://live-traffic:8080
    depends_on:
      service-registry:
        condition: service_healthy
    ports:
      - "8081:8080"

  # Traffic prediction
  traffic-predictor:
    build:
      context: ./services
      dockerfile: traffic-predictor/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      REGISTRY_URL: http://service-registry:8080
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:?Set REGISTRY_API_KEY in .env}
      REGISTRY_ADVERTISED_ENDPOINT: http://traffic-predictor:8080
      JWT_ALLOW_INSECURE_JWKS: ${JWT_ALLOW_INSECURE_JWKS:-false}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_JWKS_URL: ${JWT_JWKS_URL:-}
      JWT_ROLE_CLAIM: ${JWT_ROLE_CLAIM:-roles}
      JWT_LEEWAY_SECONDS: ${JWT_LEEWAY_SECONDS:-30}
      JWT_JWKS_TIMEOUT_SECONDS: ${JWT_JWKS_TIMEOUT_SECONDS:-5}
    depends_on:
      service-registry:
        condition: service_healthy
    ports:
      - "8082:8080"

  # Construction and incident reporting
  construction-incidents:
    build:
      context: ./services
      dockerfile: construction-incidents/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      REGISTRY_URL: http://service-registry:8080
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:?Set REGISTRY_API_KEY in .env}
      REGISTRY_ADVERTISED_ENDPOINT: http://construction-incidents:8080

      INCIDENTS_DATABASE_URL: postgresql://incidents_user:${INCIDENTS_POSTGRES_PASSWORD:?Set INCIDENTS_POSTGRES_PASSWORD in .env}@incidents-postgres:5432/smart_city_incidents

      JWT_ALLOW_INSECURE_JWKS: ${JWT_ALLOW_INSECURE_JWKS:-false}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_JWKS_URL: ${JWT_JWKS_URL:-}
      JWT_ROLE_CLAIM: ${JWT_ROLE_CLAIM:-roles}
      JWT_MODERATOR_ROLE: ${JWT_MODERATOR_ROLE:-moderator}
      JWT_LEEWAY_SECONDS: ${JWT_LEEWAY_SECONDS:-30}
      JWT_JWKS_TIMEOUT_SECONDS: ${JWT_JWKS_TIMEOUT_SECONDS:-5}

    depends_on:
      service-registry:
        condition: service_healthy
      incidents-postgres:
        condition: service_healthy
    ports:
      - "8083:8080"


  # Parking analytics
  parking-analytics:
    build:
      context: ./services
      dockerfile: parking-analytics/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      REGISTRY_URL: http://service-registry:8080
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:?Set REGISTRY_API_KEY in .env}
      REGISTRY_ADVERTISED_ENDPOINT: http://parking-analytics:8080
      JWT_ALLOW_INSECURE_JWKS: ${JWT_ALLOW_INSECURE_JWKS:-false}
      JWT_ISSUER: ${JWT_ISSUER:-}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-}
      JWT_JWKS_URL: ${JWT_JWKS_URL:-}
      JWT_ROLE_CLAIM: ${JWT_ROLE_CLAIM:-roles}
      JWT_LEEWAY_SECONDS: ${JWT_LEEWAY_SECONDS:-30}
      JWT_JWKS_TIMEOUT_SECONDS: ${JWT_JWKS_TIMEOUT_SECONDS:-5}
    depends_on:
      service-registry:
        condition: service_healthy
    ports:
      - "8084:8080"

  # Weather and air quality analytics
  weather-analytics:
    build:
      context: ./services
      dockerfile: weather-analytics/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: development
      REGISTRY_URL: http://service-registry:8080
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:?Set REGISTRY_API_KEY in .env}
      REGISTRY_ADVERTISED_ENDPOINT: http://weather-analytics:8080
    depends_on:
      service-registry:
        condition: service_healthy
    ports:
      - "8085:8080"

  # Public transit analytics
  transit-analytics:
    build:
      context: ./services
      dockerfile: transit-analytics/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: development
      REGISTRY_URL: http://service-registry:8080
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:?Set REGISTRY_API_KEY in .env}
      REGISTRY_ADVERTISED_ENDPOINT: http://transit-analytics:8080
    depends_on:
      service-registry:
        condition: service_healthy
    ports:
      - "8086:8080"

  # Gasoline price analytics
  gasoline-analytics:
    build:
      context: ./services
      dockerfile: gasoline-analytics/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: development
      REGISTRY_URL: http://service-registry:8080
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:?Set REGISTRY_API_KEY in .env}
      REGISTRY_ADVERTISED_ENDPOINT: http://gasoline-analytics:8080
    depends_on:
      service-registry:
        condition: service_healthy
    ports:
      - "8087:8080"

volumes:
  registry-data:
  postgres-data:
  incidents-postgres-data:
  keycloak-postgres-data:
