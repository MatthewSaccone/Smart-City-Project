
name: smart-city-microservices

services:
  authentik-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_DB_PASSWORD:?Set AUTHENTIK_DB_PASSWORD}
    volumes:
      - authentik-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U authentik -d authentik]
      interval: 5s
      timeout: 5s
      retries: 20
  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.8.6}
    command: server
    shm_size: 512mb
    restart: unless-stopped
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Set AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_DB_PASSWORD:?Set AUTHENTIK_DB_PASSWORD}
    volumes:
      - authentik-data:/data
    ports:
      - "127.0.0.1:8088:9000"
    depends_on:
      authentik-postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, ak, healthcheck]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.8.6}
    command: worker
    shm_size: 512mb
    user: root
    restart: unless-stopped
    environment: *authentik-env
    volumes:
      - authentik-data:/data
      - authentik-certs:/certs
    depends_on:
      authentik-postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, ak, healthcheck]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: smart_city_registry
      POSTGRES_USER: registry_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U registry_user -d smart_city_registry
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


  # Dedicated PostgreSQL database for Live Traffic
  live-traffic-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_city_traffic
      POSTGRES_USER: traffic_user
      POSTGRES_PASSWORD: ${TRAFFIC_POSTGRES_PASSWORD:?Set TRAFFIC_POSTGRES_PASSWORD in .env}
    volumes:
      - live-traffic-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traffic_user -d smart_city_traffic"]
      interval: 5s
      timeout: 5s
      retries: 10

  
  # Dedicated PostgreSQL/PostGIS database for Construction & Incidents
  incidents-postgres:
    image: postgis/postgis:16-3.5
    restart: unless-stopped

    environment:
      POSTGRES_DB: smart_city_incidents
      POSTGRES_USER: incidents_user
      POSTGRES_PASSWORD: ${INCIDENTS_POSTGRES_PASSWORD:?Set INCIDENTS_POSTGRES_PASSWORD in .env}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - incidents-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U incidents_user -d smart_city_incidents
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


  # First registry API instance
  registry-1:
    build:
      context: ./service-registry
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:?Set REGISTRY_API_KEY in .env}
      REGISTRY_DATABASE_URL: postgresql://registry_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/smart_city_registry
      REGISTRY_HEARTBEAT_INTERVAL_SECONDS: "5"
      REGISTRY_EXPIRY_SCAN_SECONDS: "1"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Second registry API instance
  registry-2:
    build:
      context: ./service-registry
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:?Set REGISTRY_API_KEY in .env}
      REGISTRY_DATABASE_URL: postgresql://registry_user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/smart_city_registry
      REGISTRY_HEARTBEAT_INTERVAL_SECONDS: "5"
      REGISTRY_EXPIRY_SCAN_SECONDS: "1"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # HAProxy registry gateway
  service-registry:
    image: haproxy:3.0-alpine
    restart: unless-stopped

    ports:
      - "8090:8080"

    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

    depends_on:
      registry-1:
        condition: service_healthy
      registry-2:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # Live traffic analytics
  live-traffic:
    image: smart-city-live-traffic:local
    build:
      context: ./services
      dockerfile: live-traffic/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      REGISTRY_URL: http://service-registry:8080
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:?Set REGISTRY_API_KEY in .env}
      REGISTRY_ADVERTISED_ENDPOINT: http://live-traffic:8080
      S1_DATABASE_URL: postgresql://traffic_user:${TRAFFIC_POSTGRES_PASSWORD:?Set TRAFFIC_POSTGRES_PASSWORD in .env}@live-traffic-postgres:5432/smart_city_traffic

      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE}
      JWT_JWKS_URL: ${JWT_JWKS_URL:?Set JWT_JWKS_URL}
      JWT_ALLOW_INSECURE_JWKS: ${JWT_ALLOW_INSECURE_JWKS:-false}
      JWT_LEEWAY_SECONDS: ${JWT_LEEWAY_SECONDS:-0}
      JWT_JWKS_TIMEOUT_SECONDS: ${JWT_JWKS_TIMEOUT_SECONDS:-5}
    depends_on:
      authentik-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      live-traffic-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Traffic prediction
  traffic-predictor:
    build:
      context: ./services
      dockerfile: traffic-predictor/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      REGISTRY_URL: http://service-registry:8080
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:?Set REGISTRY_API_KEY in .env}
      REGISTRY_ADVERTISED_ENDPOINT: http://traffic-predictor:8080
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE}
      JWT_JWKS_URL: ${JWT_JWKS_URL:?Set JWT_JWKS_URL}
      JWT_ALLOW_INSECURE_JWKS: ${JWT_ALLOW_INSECURE_JWKS:-false}
      JWT_LEEWAY_SECONDS: ${JWT_LEEWAY_SECONDS:-0}
      JWT_JWKS_TIMEOUT_SECONDS: ${JWT_JWKS_TIMEOUT_SECONDS:-5}
    depends_on:
      authentik-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Construction and incident reporting
  construction-incidents:
    build:
      context: ./services
      dockerfile: construction-incidents/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      REGISTRY_URL: http://service-registry:8080
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:?Set REGISTRY_API_KEY in .env}
      REGISTRY_ADVERTISED_ENDPOINT: http://construction-incidents:8080

      INCIDENTS_DATABASE_URL: postgresql://incidents_user:${INCIDENTS_POSTGRES_PASSWORD:?Set INCIDENTS_POSTGRES_PASSWORD in .env}@incidents-postgres:5432/smart_city_incidents


      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE}
      JWT_JWKS_URL: ${JWT_JWKS_URL:?Set JWT_JWKS_URL}
      JWT_ALLOW_INSECURE_JWKS: ${JWT_ALLOW_INSECURE_JWKS:-false}
      JWT_LEEWAY_SECONDS: ${JWT_LEEWAY_SECONDS:-0}
      JWT_JWKS_TIMEOUT_SECONDS: ${JWT_JWKS_TIMEOUT_SECONDS:-5}
    depends_on:
      authentik-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      incidents-postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8080"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6


  # Parking analytics
  parking-analytics:
    build:
      context: ./services
      dockerfile: parking-analytics/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      REGISTRY_URL: http://service-registry:8080
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:?Set REGISTRY_API_KEY in .env}
      REGISTRY_ADVERTISED_ENDPOINT: http://parking-analytics:8080
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE}
      JWT_JWKS_URL: ${JWT_JWKS_URL:?Set JWT_JWKS_URL}
      JWT_ALLOW_INSECURE_JWKS: ${JWT_ALLOW_INSECURE_JWKS:-false}
      JWT_LEEWAY_SECONDS: ${JWT_LEEWAY_SECONDS:-0}
      JWT_JWKS_TIMEOUT_SECONDS: ${JWT_JWKS_TIMEOUT_SECONDS:-5}
    depends_on:
      authentik-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    ports:
      - "127.0.0.1:8084:8080"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Weather and air quality analytics
  weather-analytics:
    build:
      context: ./services
      dockerfile: weather-analytics/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      REGISTRY_URL: http://service-registry:8080
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:?Set REGISTRY_API_KEY in .env}
      REGISTRY_ADVERTISED_ENDPOINT: http://weather-analytics:8080
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE}
      JWT_JWKS_URL: ${JWT_JWKS_URL:?Set JWT_JWKS_URL}
      JWT_ALLOW_INSECURE_JWKS: ${JWT_ALLOW_INSECURE_JWKS:-false}
      JWT_LEEWAY_SECONDS: ${JWT_LEEWAY_SECONDS:-0}
      JWT_JWKS_TIMEOUT_SECONDS: ${JWT_JWKS_TIMEOUT_SECONDS:-5}
    depends_on:
      authentik-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    ports:
      - "127.0.0.1:8085:8080"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Public transit analytics
  transit-analytics:
    build:
      context: ./services
      dockerfile: transit-analytics/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      REGISTRY_URL: http://service-registry:8080
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:?Set REGISTRY_API_KEY in .env}
      REGISTRY_ADVERTISED_ENDPOINT: http://transit-analytics:8080
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE}
      JWT_JWKS_URL: ${JWT_JWKS_URL:?Set JWT_JWKS_URL}
      JWT_ALLOW_INSECURE_JWKS: ${JWT_ALLOW_INSECURE_JWKS:-false}
      JWT_LEEWAY_SECONDS: ${JWT_LEEWAY_SECONDS:-0}
      JWT_JWKS_TIMEOUT_SECONDS: ${JWT_JWKS_TIMEOUT_SECONDS:-5}
    depends_on:
      authentik-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    ports:
      - "127.0.0.1:8086:8080"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Gasoline price analytics
  gasoline-analytics:
    build:
      context: ./services
      dockerfile: gasoline-analytics/Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      REGISTRY_URL: http://service-registry:8080
      REGISTRY_API_KEY: ${REGISTRY_API_KEY:?Set REGISTRY_API_KEY in .env}
      REGISTRY_ADVERTISED_ENDPOINT: http://gasoline-analytics:8080
      JWT_ISSUER: ${JWT_ISSUER:?Set JWT_ISSUER}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE}
      JWT_JWKS_URL: ${JWT_JWKS_URL:?Set JWT_JWKS_URL}
      JWT_ALLOW_INSECURE_JWKS: ${JWT_ALLOW_INSECURE_JWKS:-false}
      JWT_LEEWAY_SECONDS: ${JWT_LEEWAY_SECONDS:-0}
      JWT_JWKS_TIMEOUT_SECONDS: ${JWT_JWKS_TIMEOUT_SECONDS:-5}
    depends_on:
      authentik-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    ports:
      - "127.0.0.1:8087:8080"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6


  # Unified Swagger documentation for all seven microservices
  api-docs:
    build:
      context: ./api-docs
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      AUTHENTIK_PUBLIC_URL: ${AUTHENTIK_PUBLIC_URL:-http://localhost:8088}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?Set JWT_AUDIENCE}
    depends_on:
      authentik-server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8091:8080"

volumes:
  registry-data:
  postgres-data:
  live-traffic-postgres-data:
  incidents-postgres-data:
  authentik-postgres-data:
  authentik-data:
  authentik-certs:
